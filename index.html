<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <title>CYBER FOCUS // HUD v3.5</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@400;500;700;900&family=Share+Tech+Mono&family=Noto+Sans+SC:wght@400;500;700&display=swap" rel="stylesheet">
    <script src="https://cdn.jsdelivr.net/npm/canvas-confetti@1.6.0/dist/confetti.browser.min.js"></script>
    
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    colors: {
                        void: '#050505',
                        cyan: '#00f3ff',
                        pink: '#ff0055',
                        green: '#0aff00',
                        amber: '#ffaa00',
                        dark: '#0a0f14',
                        panel: 'rgba(15, 23, 42, 0.9)', // 新的面板背景色
                        glass: 'rgba(15, 23, 42, 0.6)'
                    },
                    fontFamily: {
                        display: ['Orbitron', 'sans-serif'],
                        mono: ['Share Tech Mono', 'monospace'],
                        sc: ['Noto Sans SC', 'sans-serif'],
                    },
                    animation: {
                        'pulse-slow': 'pulse 3s cubic-bezier(0.4, 0, 0.6, 1) infinite',
                        'scan': 'scanline 8s linear infinite',
                    },
                    keyframes: {
                        scanline: {
                            '0%': { transform: 'translateY(0)' },
                            '100%': { transform: 'translateY(100vh)' },
                        }
                    }
                }
            }
        }
    </script>

    <style>
        :root {
            --bg-void: #050505;
            --neon-cyan: #00f3ff;
            --neon-pink: #ff0055;
            --neon-green: #0aff00;
            --neon-amber: #ffaa00;
            --panel-border: rgba(0, 243, 255, 0.2);
        }

        body {
            background-color: #020406;
            /* 稍微提亮一点背景纹理 */
            background-image: 
                linear-gradient(rgba(0, 243, 255, 0.03) 1px, transparent 1px),
                linear-gradient(90deg, rgba(0, 243, 255, 0.03) 1px, transparent 1px);
            background-size: 40px 40px;
            color: var(--neon-cyan);
            font-family: 'Share Tech Mono', 'Noto Sans SC', monospace;
            min-height: 100vh;
            overflow-x: hidden;
            -webkit-tap-highlight-color: transparent;
            padding-bottom: env(safe-area-inset-bottom);
        }

        /* CRT Scanlines Overlay */
        .scanlines {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: linear-gradient(
                to bottom,
                rgba(255,255,255,0),
                rgba(255,255,255,0) 50%,
                rgba(0,0,0,0.2) 50%,
                rgba(0,0,0,0.2)
            );
            background-size: 100% 4px;
            pointer-events: none;
            z-index: 9999;
            opacity: 0.3;
        }

        /* UI Components - Enhanced Panel */
        .hud-panel {
            background: var(--panel);
            border: 1px solid var(--panel-border);
            backdrop-filter: blur(8px);
            box-shadow: 0 10px 30px rgba(0,0,0,0.5);
            position: relative;
            /* 内部网格纹理 */
            background-image: 
                radial-gradient(rgba(0, 243, 255, 0.05) 1px, transparent 1px);
            background-size: 10px 10px;
        }

        /* Tech Corners Decoration */
        .hud-panel::before, .hud-panel::after, 
        .hud-corner-bl, .hud-corner-tr {
            content: '';
            position: absolute;
            width: 8px;
            height: 8px;
            border-color: var(--neon-cyan);
            border-style: solid;
            transition: all 0.3s ease;
            pointer-events: none;
        }
        /* Top Left */
        .hud-panel::before { top: -1px; left: -1px; border-width: 2px 0 0 2px; }
        /* Bottom Right */
        .hud-panel::after { bottom: -1px; right: -1px; border-width: 0 2px 2px 0; }
        /* Bottom Left (using span inside) */
        .hud-corner-bl { bottom: -1px; left: -1px; border-width: 0 0 2px 2px; }
        /* Top Right (using span inside) */
        .hud-corner-tr { top: -1px; right: -1px; border-width: 2px 2px 0 0; }
        
        /* Ruler Markings Decoration */
        .deco-ruler {
            position: absolute;
            right: -1px;
            top: 20px;
            bottom: 20px;
            width: 4px;
            background-image: linear-gradient(to bottom, var(--neon-cyan) 1px, transparent 1px);
            background-size: 100% 10px;
            opacity: 0.3;
            pointer-events: none;
        }

        .glitch-text { text-shadow: 2px 0 rgba(255,0,0,0.5), -2px 0 rgba(0,255,255,0.5); }
        
        /* Buttons */
        .btn-control {
            width: 56px; height: 56px;
            display: flex; align-items: center; justify-content: center;
            clip-path: polygon(20% 0, 100% 0, 100% 80%, 80% 100%, 0 100%, 0 20%);
            transition: all 0.2s;
            background: rgba(0,0,0,0.6);
            border: 1px solid currentColor;
            box-shadow: 0 0 10px rgba(0,0,0,0.3);
        }
        .btn-control:active { transform: scale(0.92); box-shadow: 0 0 0 transparent; }
        
        .btn-mode {
            background: rgba(0, 243, 255, 0.03);
            border: 1px solid rgba(0, 243, 255, 0.15);
            transition: all 0.2s;
            position: relative;
            overflow: hidden;
        }
        .btn-mode:hover { background: rgba(0, 243, 255, 0.08); }
        .btn-mode.active {
            background: rgba(0, 243, 255, 0.15);
            border-color: var(--neon-cyan);
            box-shadow: inset 0 0 15px rgba(0, 243, 255, 0.2);
        }
        .btn-mode.active .mode-title { color: var(--neon-cyan); text-shadow: 0 0 8px var(--neon-cyan); }

        /* Flow Lights */
        .flow-slot {
            width: 12px; height: 6px;
            background: #1a1a1a;
            border: 1px solid #333;
            transform: skewX(-20deg);
            transition: all 0.5s;
        }
        .flow-slot.active {
            background: var(--neon-green);
            box-shadow: 0 0 8px var(--neon-green);
            border-color: #fff;
        }

        /* Heatmap & Tabs */
        .tab-selector {
            position: relative;
            background: rgba(0, 243, 255, 0.05);
            border: 1px solid rgba(0, 243, 255, 0.2);
            transition: all 0.2s;
        }
        .tab-selector.active {
            background: rgba(0, 243, 255, 0.15);
            color: #fff;
            border-color: var(--neon-cyan);
            text-shadow: 0 0 5px rgba(0, 243, 255, 0.5);
        }
        
        /* Checkboxes */
        .cyber-check {
            appearance: none;
            width: 20px;
            height: 20px;
            border: 1px solid var(--neon-cyan);
            background: rgba(0,0,0,0.5);
            display: grid;
            place-content: center;
            cursor: pointer;
            position: relative;
        }
        .cyber-check::before {
            content: "";
            width: 10px;
            height: 10px;
            transform: scale(0);
            background: var(--neon-cyan);
            transition: 120ms transform ease-in-out;
            box-shadow: 0 0 8px var(--neon-cyan);
        }
        .cyber-check:checked::before { transform: scale(1); }
        
        /* Modals */
        .modal-overlay { background: rgba(5, 5, 10, 0.9); backdrop-filter: blur(5px); }
        .cyber-scroll::-webkit-scrollbar { width: 4px; }
        .cyber-scroll::-webkit-scrollbar-thumb { background: var(--neon-cyan); }
        .cyber-scroll::-webkit-scrollbar-track { background: rgba(0,0,0,0.3); }

        /* Helper for description text lines */
        .desc-line {
            display: block;
            width: 100%;
            height: 1px;
            background: linear-gradient(90deg, transparent, rgba(0,243,255,0.3), transparent);
            margin: 8px 0;
        }
    </style>
</head>
<body class="p-3 md:p-6 max-w-5xl mx-auto flex flex-col gap-4 safe-pb text-sm relative">

    <!-- Global Scanlines -->
    <div class="scanlines"></div>

    <!-- Header -->
    <header class="flex flex-col gap-3 border-b border-gray-800 pb-3 relative z-10">
        <div class="flex justify-between items-start">
            <div class="flex items-center gap-3">
                <div id="realTimeClock" class="text-3xl font-display font-bold text-white tracking-widest drop-shadow-[0_0_5px_rgba(255,255,255,0.5)]">00:00</div>
                <div class="flex flex-col">
                    <div class="text-[10px] text-gray-500 tracking-[0.2em] flex items-center gap-2">
                        <span class="w-2 h-2 bg-green-500 rounded-full animate-pulse shadow-[0_0_5px_#0aff00]"></span>
                        <span data-i18n="system_online">ONLINE</span>
                    </div>
                    <div class="text-[10px] text-cyan opacity-70">HUD v3.5</div>
                </div>
            </div>
            
            <div class="flex gap-2">
                <button onclick="toggleLang()" class="border border-gray-700 px-2 py-1 text-[10px] hover:border-cyan transition bg-dark/50" id="langBtn">EN</button>
                <button onclick="openHistory()" class="border border-gray-700 px-2 py-1 text-[10px] hover:border-amber hover:text-amber transition flex items-center gap-1 bg-dark/50">
                    <span data-i18n="history_btn">档案</span>
                </button>
            </div>
        </div>

        <!-- RPG Stats -->
        <div class="flex items-center gap-3 text-xs font-mono">
            <div class="text-amber font-bold drop-shadow-[0_0_5px_rgba(255,170,0,0.5)]">LVL <span id="userLevel" class="text-base">1</span></div>
            <div class="flex-1 flex flex-col gap-1">
                <div class="flex justify-between text-[10px] text-gray-400">
                    <span id="userTitle" class="text-cyan">义体乞丐</span>
                    <span><span id="currentXp">0</span> / <span id="nextLevelXp">100</span> XP</span>
                </div>
                <div class="h-1 bg-gray-900 border border-gray-800 relative overflow-hidden">
                    <div id="xpBar" class="h-full bg-amber shadow-[0_0_10px_orange] transition-all duration-500 w-0"></div>
                </div>
            </div>
        </div>
    </header>

    <main class="grid grid-cols-1 md:grid-cols-2 gap-4 relative z-10">
        
        <!-- MODULE: TIMER & CONTROL DECK -->
        <div class="flex flex-col gap-4">
            <div class="hud-panel p-5 relative flex flex-col items-center">
                <!-- Tech Decoration -->
                <div class="hud-corner-bl"></div>
                <div class="hud-corner-tr"></div>
                <div class="deco-ruler"></div>
                
                <div class="absolute top-2 left-3 text-[10px] text-gray-500 border-l-2 border-cyan pl-2 font-mono tracking-widest" data-i18n="module_timer">计时核心 // TIMER CORE</div>
                
                <!-- Center Stage: Buttons + Ring -->
                <div class="flex items-center justify-center w-full gap-2 mt-6 mb-2">
                    
                    <!-- Left: Stop Button -->
                    <button onclick="triggerStop()" class="btn-control text-pink-500 hover:bg-pink-500/20 hover:text-white group hover:border-pink-500">
                        <svg class="w-6 h-6 fill-current drop-shadow-[0_0_5px_rgba(255,0,85,0.8)]" viewBox="0 0 24 24"><path d="M6 6h12v12H6z"/></svg>
                    </button>

                    <!-- Center: Ring -->
                    <div class="relative w-48 h-48 flex-shrink-0">
                        <svg class="w-full h-full transform -rotate-90">
                            <circle cx="96" cy="96" r="88" stroke-width="2" stroke="rgba(255,255,255,0.05)" fill="none"></circle>
                            <circle id="progressRing" cx="96" cy="96" r="88" stroke-width="4" fill="none" stroke="var(--neon-cyan)" stroke-dasharray="552" stroke-dashoffset="0" class="transition-all duration-300 drop-shadow-[0_0_8px_rgba(0,243,255,0.3)]"></circle>
                        </svg>
                        <div class="absolute inset-0 flex flex-col items-center justify-center z-10">
                            <div id="modeLabel" class="text-[10px] tracking-[0.2em] text-gray-400 mb-1 font-bold">READY</div>
                            <div id="timerDisplay" class="text-4xl font-mono font-bold tracking-tighter text-white drop-shadow-[0_0_10px_rgba(255,255,255,0.5)]">00:00</div>
                            
                            <!-- Flow Lights (New) -->
                            <div class="flex gap-1 mt-3" id="flowLightsContainer">
                                <div class="flow-slot"></div>
                                <div class="flow-slot"></div>
                                <div class="flow-slot"></div>
                                <div class="flow-slot"></div>
                                <div class="flow-slot"></div>
                            </div>
                            <!-- Description for Flow Lights -->
                            <div class="text-[9px] text-cyan/60 mt-1 tracking-wider scale-90 origin-top font-mono">
                                专注心流灯：+1/5分钟（+XP)
                            </div>
                        </div>
                    </div>

                    <!-- Right: Play/Pause Button -->
                    <button id="mainActionBtn" onclick="toggleTimer()" class="btn-control text-cyan hover:bg-cyan/20 hover:text-white group hover:border-cyan">
                        <!-- Play -->
                        <svg id="iconPlay" class="w-8 h-8 fill-current ml-1 drop-shadow-[0_0_5px_rgba(0,243,255,0.8)]" viewBox="0 0 24 24"><path d="M8 5v14l11-7z"/></svg>
                        <!-- Pause -->
                        <svg id="iconPause" class="w-8 h-8 fill-current hidden drop-shadow-[0_0_5px_rgba(0,243,255,0.8)]" viewBox="0 0 24 24"><path d="M6 19h4V5H6v14zm8-14v14h4V5h-4z"/></svg>
                    </button>
                </div>

                <!-- Divider -->
                <div class="desc-line"></div>

                <!-- Mode Selectors (Touchpad Style) with Tooltips -->
                <div class="grid grid-cols-2 gap-3 w-full mt-2">
                    <!-- Deep Work -->
                    <button onclick="checkTimerSafety(90, 'sprint')" id="mode-sprint" class="btn-mode py-2 px-3 text-left group flex flex-col">
                        <div class="flex justify-between items-baseline w-full">
                            <div class="text-lg font-bold text-white mode-title">90m</div>
                            <div class="text-[9px] text-gray-500 font-mono">DEEP</div>
                        </div>
                        <div class="text-[10px] text-gray-400 group-hover:text-cyan/80 mt-1" data-i18n="desc_90">深度心流 // 攻克核心难题</div>
                    </button>

                    <!-- Rush -->
                    <button onclick="checkTimerSafety(25, 'pomodoro')" id="mode-pomodoro" class="btn-mode py-2 px-3 text-left group flex flex-col">
                        <div class="flex justify-between items-baseline w-full">
                            <div class="text-lg font-bold text-white mode-title">25m</div>
                            <div class="text-[9px] text-gray-500 font-mono">RUSH</div>
                        </div>
                        <div class="text-[10px] text-gray-400 group-hover:text-cyan/80 mt-1" data-i18n="desc_25">高频突击 // 快速清理杂务</div>
                    </button>

                    <!-- Rest -->
                    <button onclick="checkTimerSafety(15, 'break')" id="mode-break" class="btn-mode py-2 px-3 text-left group flex flex-col border-gray-800">
                        <div class="flex justify-between items-baseline w-full">
                            <div class="text-lg font-bold text-green-500 mode-title">15m</div>
                            <div class="text-[9px] text-gray-600 font-mono">REST</div>
                        </div>
                        <div class="text-[10px] text-gray-500 group-hover:text-green-400 mt-1" data-i18n="desc_15">系统维护 // 远离屏幕休息</div>
                    </button>

                    <!-- Cool -->
                    <button onclick="checkTimerSafety(5, 'short')" id="mode-short" class="btn-mode py-2 px-3 text-left group flex flex-col border-gray-800">
                        <div class="flex justify-between items-baseline w-full">
                            <div class="text-lg font-bold text-green-500 mode-title">05m</div>
                            <div class="text-[9px] text-gray-600 font-mono">COOL</div>
                        </div>
                        <div class="text-[10px] text-gray-500 group-hover:text-green-400 mt-1" data-i18n="desc_05">生理冷却 // 短暂调整呼吸</div>
                    </button>
                </div>
            </div>
        </div>

        <!-- MODULE: TASKS -->
        <div class="flex flex-col gap-4 h-full">
            <div class="hud-panel p-5 flex-1 flex flex-col min-h-[450px] relative">
                 <!-- Tech Decoration -->
                 <div class="hud-corner-bl"></div>
                 <div class="hud-corner-tr"></div>
                 <div class="deco-ruler" style="left: -1px; right: auto;"></div>

                <!-- Tab Switcher -->
                <div class="flex items-center gap-3 mb-4 border-b border-gray-800 pb-2">
                    <button onclick="switchTab('primary')" class="tab-selector px-3 py-1 text-sm font-bold uppercase tracking-widest transition-all opacity-40 hover:opacity-100" id="tab-primary" data-i18n="tab_main">主线任务</button>
                    <button onclick="switchTab('side')" class="tab-selector px-3 py-1 text-sm font-bold uppercase tracking-widest transition-all opacity-40 hover:opacity-100" id="tab-side" data-i18n="tab_side">突发行动</button>
                    <div class="flex-1 text-right font-mono text-gray-500" id="taskProgress">0/3</div>
                </div>

                <!-- Task Guidelines (Dynamic) -->
                <div id="taskGuide" class="text-[10px] text-amber/90 border border-amber/30 bg-amber/5 p-2 mb-3 text-center tracking-wide font-mono">
                    <span class="animate-pulse">⚠️</span> <span data-i18n="guide_main">战术准则：【今日仅锁定 3 个高价值任务目标】</span>
                </div>

                <div id="taskList" class="flex-1 flex flex-col gap-3 overflow-y-auto cyber-scroll pr-1">
                    <!-- Tasks injected via JS -->
                </div>

                <!-- Archive Button -->
                <button onclick="archiveDay()" class="mt-4 w-full py-3 border border-gray-700 bg-black/30 text-gray-500 hover:text-cyan hover:border-cyan hover:bg-cyan/5 text-xs tracking-[0.2em] uppercase transition font-mono" data-i18n="archive_day_btn">
                    >> 归档今日数据 <<
                </button>
            </div>
        </div>

    </main>

    <!-- UNIFIED DIALOG MODAL -->
    <div id="dialogModal" class="fixed inset-0 modal-overlay z-[100] hidden flex items-center justify-center p-6">
        <div class="hud-panel w-full max-w-sm p-0 bg-dark modal-content border-l-4 border-l-cyan shadow-[0_0_30px_rgba(0,243,255,0.1)]">
            <div class="p-4 border-b border-gray-800 bg-cyan/5">
                <h3 id="dialogTitle" class="text-lg font-bold text-white uppercase tracking-wider font-display">SYSTEM ALERT</h3>
            </div>
            <div class="p-5 bg-dark/90">
                <div id="dialogBody" class="text-sm text-gray-300 font-mono mb-6 leading-relaxed"></div>
                <div id="dialogExtra" class="mb-4 hidden"></div>

                <div class="flex gap-3 justify-end">
                    <button id="dialogCancel" class="px-4 py-2 border border-gray-700 text-gray-500 text-xs hover:text-white uppercase hover:border-white transition" onclick="closeDialog()">Cancel</button>
                    <button id="dialogConfirm" class="px-4 py-2 bg-cyan/10 border border-cyan text-cyan text-xs font-bold uppercase hover:bg-cyan hover:text-black transition shadow-[0_0_10px_rgba(0,243,255,0.2)]">Confirm</button>
                </div>
            </div>
        </div>
    </div>

    <!-- PRE-FLIGHT CHECK MODAL -->
    <div id="flowCheckModal" class="fixed inset-0 modal-overlay z-50 hidden flex items-center justify-center p-4">
        <div class="hud-panel w-full max-w-md p-6 transform transition-all bg-dark/95 modal-content shadow-[0_0_50px_rgba(0,0,0,0.8)]">
             <div class="hud-corner-bl"></div>
             <div class="hud-corner-tr"></div>
            
            <h2 class="text-xl text-cyan mb-1 text-center font-display tracking-wider" data-i18n="modal_dive_title">启动深潜模式</h2>
            <div class="text-[10px] text-gray-500 text-center mb-6 font-mono uppercase">Protocol Sequence Initiated</div>
            
            <div class="space-y-3 mb-6 mt-4">
                <label class="flex items-center gap-3 p-3 border border-gray-800 active:border-cyan transition bg-black/40 cursor-pointer group hover:bg-cyan/5">
                    <input type="checkbox" class="cyber-check checklist-item">
                    <div class="flex-1">
                        <div class="text-sm font-bold text-white group-hover:text-cyan transition" data-i18n="check_target">目标锁定</div>
                    </div>
                </label>
                <label class="flex items-center gap-3 p-3 border border-gray-800 active:border-cyan transition bg-black/40 cursor-pointer group hover:bg-cyan/5">
                    <input type="checkbox" class="cyber-check checklist-item">
                    <div class="flex-1">
                        <div class="text-sm font-bold text-white group-hover:text-cyan transition" data-i18n="check_silence">通讯静默</div>
                    </div>
                </label>
                <label class="flex items-center gap-3 p-3 border border-gray-800 active:border-cyan transition bg-black/40 cursor-pointer group hover:bg-cyan/5">
                    <input type="checkbox" class="cyber-check checklist-item">
                    <div class="flex-1">
                        <div class="text-sm font-bold text-white group-hover:text-cyan transition" data-i18n="check_bio">生理机能</div>
                    </div>
                </label>
            </div>

            <div class="flex gap-3">
                <button onclick="closeModal('flowCheckModal')" class="flex-1 py-3 border border-gray-700 text-gray-500 text-xs font-mono uppercase hover:text-white hover:border-white transition" data-i18n="btn_abort">放弃</button>
                <button id="engageBtn" onclick="confirmStart()" class="flex-1 py-3 bg-cyan/10 border border-cyan text-cyan font-bold font-display uppercase tracking-widest opacity-50 cursor-not-allowed hover:shadow-[0_0_15px_rgba(0,243,255,0.4)] transition" disabled data-i18n="btn_engage">接入系统</button>
            </div>
        </div>
    </div>

    <!-- ARCHIVE MODAL -->
    <div id="historyModal" class="fixed inset-0 modal-overlay z-50 hidden flex flex-col bg-void overflow-hidden">
        <div class="p-4 border-b border-gray-800 flex justify-between items-center bg-slate-900/90 z-10 relative">
            <div class="scanlines opacity-10"></div>
            <h2 class="text-lg text-amber tracking-widest font-display" data-i18n="history_title">DATA ARCHIVES</h2>
            <button onclick="closeModal('historyModal')" class="text-gray-500 hover:text-white text-xl p-2 z-20">×</button>
        </div>
        
        <div class="flex-1 flex flex-col overflow-hidden relative bg-slate-900/80">
             <div class="scanlines opacity-10"></div>
            <!-- Month Navigation -->
            <div class="p-4 bg-black/20 border-b border-gray-800 flex-shrink-0">
                <div class="flex justify-between items-center mb-3 text-cyan font-mono">
                    <button onclick="changeHeatmapMonth(-1)" class="px-3 py-1 hover:bg-cyan/20 border border-gray-700 transition">&lt;</button>
                    <span id="heatmapMonthLabel" class="font-bold text-lg drop-shadow-[0_0_5px_rgba(0,243,255,0.5)]">2023-10</span>
                    <button onclick="changeHeatmapMonth(1)" class="px-3 py-1 hover:bg-cyan/20 border border-gray-700 transition">&gt;</button>
                </div>
            </div>

            <!-- History List -->
            <div id="historyList" class="flex-1 overflow-y-auto p-4 space-y-3 cyber-scroll">
                <!-- Items injected here -->
            </div>
        </div>
    </div>

    <script>
        // --- CONFIG & STATE ---
        const CONFIG = {
            sprint: { time: 90 * 60, color: '#00f3ff', labelKey: 'mode_deep' },
            pomodoro: { time: 25 * 60, color: '#00f3ff', labelKey: 'mode_skirmish' },

        // --- AUDIO SYSTEM ---
        const AudioSys = {
            ctx: null, unlocked: false,
            init: function() { if (!this.ctx) this.ctx = new (window.AudioContext || window.webkitAudioContext)(); },
            unlock: function() {
                if (this.unlocked || !this.ctx) return;
                const buffer = this.ctx.createBuffer(1, 1, 22050);
                const source = this.ctx.createBufferSource();
                source.buffer = buffer;
                source.connect(this.ctx.destination);
                source.start(0);
                if (this.ctx.state === 'suspended') this.ctx.resume();
                this.unlocked = true;
                document.removeEventListener('touchstart', unlockAudio);
                document.removeEventListener('click', unlockAudio);
            },
            playTone: function(freq, type, duration, vol = 0.1, startTime = 0) {
                if (!this.ctx) this.init();
                const osc = this.ctx.createOscillator();
                const gain = this.ctx.createGain();
                osc.type = type; 
                const t = startTime || this.ctx.currentTime;
                osc.frequency.setValueAtTime(freq, t);
                gain.gain.setValueAtTime(vol, t);
                gain.gain.exponentialRampToValueAtTime(0.01, t + duration);
                osc.connect(gain);
                gain.connect(this.ctx.destination);
                osc.start(t);
                osc.stop(t + duration);
            },
            sfx: {
                click: () => AudioSys.playTone(800, 'square', 0.05, 0.05),
                light: () => AudioSys.playTone(1200, 'sine', 0.5, 0.1), 
                start: () => {
                    const t = AudioSys.ctx.currentTime;
                    AudioSys.playTone(200, 'sawtooth', 0.5, 0.1, t);
                    AudioSys.playTone(800, 'sawtooth', 0.8, 0.1, t+0.2);
                },
                alarm: () => {
                    const now = AudioSys.ctx.currentTime;
                    AudioSys.playTone(880, 'square', 0.1, 0.2, now);
                    AudioSys.playTone(880, 'square', 0.4, 0.2, now + 0.3);
                },
                xp: () => { AudioSys.playTone(1200, 'sine', 0.1, 0.05); setTimeout(() => AudioSys.playTone(1800, 'sine', 0.2, 0.05), 50); },
                check: () => AudioSys.playTone(1200, 'sine', 0.1, 0.1)
            }
        };
        function unlockAudio() { AudioSys.init(); AudioSys.unlock(); }

        // --- TIMER & FLOW LOGIC ---
        let timerTicker = null;

        function updateRealTime() {
            const now = new Date();
            const str = now.toLocaleTimeString([], {hour: '2-digit', minute:'2-digit'});
            document.getElementById('realTimeClock').innerText = str;
        }

        function updateTimerUI(remaining) {
            const m = Math.floor(remaining / 60);
            const s = remaining % 60;
            const displayStr = `${String(m).padStart(2,'0')}:${String(s).padStart(2,'0')}`;
            document.getElementById('timerDisplay').textContent = displayStr;
            
            const circumference = 552;
            const total = STATE.timer.totalSeconds || CONFIG[STATE.timer.mode].time; 
            // Fix for division by zero if totalSeconds is 0
            const offset = total > 0 ? circumference - (remaining / total) * circumference : 0;
            const ring = document.getElementById('progressRing');
            ring.style.strokeDashoffset = offset;
            
            const cfg = CONFIG[STATE.timer.mode];
            ring.style.stroke = cfg.color;
            document.getElementById('modeLabel').style.color = cfg.color;
            document.getElementById('modeLabel').textContent = STATE.timer.active ? t('status_focus') : t(cfg.labelKey);

            const slots = document.querySelectorAll('.flow-slot');
            slots.forEach((slot, i) => {
                if (i < STATE.timer.flowLights) slot.classList.add('active');
                else slot.classList.remove('active');
            });

            const btnPlay = document.getElementById('iconPlay');
            const btnPause = document.getElementById('iconPause');
            if(STATE.timer.active) {
                btnPlay.classList.add('hidden');
                btnPause.classList.remove('hidden');
            } else {
                btnPlay.classList.remove('hidden');
                btnPause.classList.add('hidden');
            }

            document.querySelectorAll('.btn-mode').forEach(b => b.classList.remove('active'));
            if(STATE.timer.mode) {
                const activeBtn = document.getElementById(`mode-${STATE.timer.mode}`);
                if(activeBtn) activeBtn.classList.add('active');
            }
        }

        function tick() {
            if (!STATE.timer.active) return;
            const now = Date.now();
            const remaining = Math.max(0, Math.ceil((STATE.timer.endTime - now) / 1000));
            
            const elapsed = STATE.timer.totalSeconds - remaining;
            const lightsShouldBe = Math.min(5, Math.floor(elapsed / 300));
            
            if (lightsShouldBe > STATE.timer.flowLights) {
                STATE.timer.flowLights = lightsShouldBe;
                AudioSys.sfx.light();
            }

            updateTimerUI(remaining);
            if (remaining <= 0) completeTimer();
        }

        function toggleTimer() {
            AudioSys.sfx.click();
            if (STATE.timer.active) {
                const now = Date.now();
                const remaining = Math.max(0, Math.ceil((STATE.timer.endTime - now) / 1000));
                STATE.timer.active = false;
                STATE.timer.pausedLeft = remaining;
                STATE.timer.endTime = null;
                STATE.timer.flowLights = Math.max(0, STATE.timer.flowLights - 1);
                clearInterval(timerTicker);
                updateTimerUI(STATE.timer.pausedLeft);
            } else {
                if (STATE.timer.pausedLeft <= 0) return;
                STATE.timer.active = true;
                STATE.timer.endTime = Date.now() + (STATE.timer.pausedLeft * 1000);
                AudioSys.sfx.start();
                tick(); 
                timerTicker = setInterval(tick, 1000);
            }
            saveSystem();
        }

        function setTimerDirect(min, mode) {
            clearInterval(timerTicker);
            STATE.timer.active = false;
            STATE.timer.mode = mode;
            STATE.timer.totalSeconds = min * 60;
            STATE.timer.pausedLeft = min * 60;
            STATE.timer.endTime = null;
            STATE.timer.flowLights = 0;
            updateTimerUI(STATE.timer.pausedLeft);
            saveSystem();
        }

        function checkTimerSafety(min, mode) {
            const isActiveOrPaused = STATE.timer.active || (STATE.timer.pausedLeft !== STATE.timer.totalSeconds && STATE.timer.pausedLeft > 0);
            if(isActiveOrPaused) {
                showDialog(t('dialog_reset_title'), t('dialog_reset_msg'), () => preFlightOrDirect(min, mode));
            } else {
                preFlightOrDirect(min, mode);
            }
        }

        function preFlightOrDirect(min, mode) {
            AudioSys.sfx.click();
            if(mode === 'sprint' || mode === 'pomodoro') {
                document.getElementById('flowCheckModal').classList.remove('hidden');
                document.getElementById('flowCheckModal').dataset.targetMin = min;
                document.getElementById('flowCheckModal').dataset.targetMode = mode;
                document.querySelectorAll('.checklist-item').forEach(cb => cb.checked = false);
                // Rebind for sound
                document.querySelectorAll('.cyber-check.checklist-item').forEach(cb => {
                    const clone = cb.cloneNode(true);
                    cb.parentNode.replaceChild(clone, cb);
                    clone.addEventListener('change', function() {
                        AudioSys.sfx.check();
                        checkGatekeeper();
                    });
                });
                checkGatekeeper();
            } else {
                setTimerDirect(min, mode);
            }
        }

        function confirmStart() {
            const min = document.getElementById('flowCheckModal').dataset.targetMin;
            const mode = document.getElementById('flowCheckModal').dataset.targetMode;
            closeModal('flowCheckModal');
            setTimerDirect(min, mode);

        function checkGatekeeper() {
            const allChecked = Array.from(document.querySelectorAll('.checklist-item')).every(cb => cb.checked);
            const btn = document.getElementById('engageBtn');
            btn.disabled = !allChecked;
            if(allChecked) btn.classList.remove('opacity-50', 'cursor-not-allowed');
            else btn.classList.add('opacity-50', 'cursor-not-allowed');
        }

        function triggerStop() {
            AudioSys.sfx.click();
            if(STATE.timer.pausedLeft <= 0 && !STATE.timer.active) {
                setTimerDirect(CONFIG[STATE.timer.mode].time / 60, STATE.timer.mode);
                return;
            }
            clearInterval(timerTicker);
            STATE.timer.active = false;
            
            let elapsed = 0;
            if(STATE.timer.endTime) elapsed = STATE.timer.totalSeconds - Math.max(0, Math.ceil((STATE.timer.endTime - Date.now()) / 1000));
            else elapsed = STATE.timer.totalSeconds - STATE.timer.pausedLeft;

            STATE.timer.pausedLeft = STATE.timer.totalSeconds;
            STATE.timer.flowLights = 0;
            STATE.timer.endTime = null;
            updateTimerUI(STATE.timer.totalSeconds);
            saveSystem();

            if(elapsed > 60) showDebrief(Math.floor((elapsed / 60) * 0.5));
        }

        function completeTimer() {
            clearInterval(timerTicker);
            STATE.timer.active = false;
            STATE.timer.endTime = null;
            STATE.timer.pausedLeft = 0;
            updateTimerUI(0);
            saveSystem();
            AudioSys.sfx.alarm();
            
            const baseXp = Math.floor(STATE.timer.totalSeconds / 60 * 2);
            const bonusXp = STATE.timer.flowLights * 10;
            GAME.addXp(baseXp + bonusXp);

                setTimerDirect(CONFIG[STATE.timer.mode].time / 60, STATE.timer.mode);

        function changeHeatmapMonth(delta) {

        function renderHistoryList() {
            const y = viewDate.getFullYear();
            const m = viewDate.getMonth();
            document.getElementById('heatmapMonthLabel').textContent = `${y}-${String(m+1).padStart(2,'0')}`;
            
            const monthRecords = STATE.history.filter(h => {
                const recordDate = new Date(h.date);
                return recordDate.getFullYear() === y && recordDate.getMonth() === m;
            });
            monthRecords.sort((a, b) => new Date(b.date) - new Date(a.date));
            
            const list = document.getElementById('historyList');
            list.innerHTML = '';
            
            if(!monthRecords || monthRecords.length === 0) {
                list.innerHTML = `<div class="text-center text-gray-600 mt-4 font-mono">NO DATA SECTOR ${y}-${String(m+1).padStart(2,'0')}</div>`;
                return;
            }
            
            const groupedRecords = {};
            monthRecords.forEach(rec => {
                const dateStr = rec.date.split('T')[0];
                if(!groupedRecords[dateStr]) groupedRecords[dateStr] = [];
                groupedRecords[dateStr].push(rec);
            });
            
            Object.keys(groupedRecords).forEach(dateStr => {
                const dateRecords = groupedRecords[dateStr];
                const totalPoints = dateRecords.reduce((sum, rec) => sum + rec.completedCount, 0);
                
                const dateCard = document.createElement('div');
                dateCard.className = "border border-gray-700 bg-white/5 p-3";
                
                const dateHeader = document.createElement('div');
                dateHeader.className = "flex justify-between items-center mb-2";
                dateHeader.innerHTML = `
                    <span class="text-amber font-bold font-display">${formatDisplayDate(dateStr)}</span>
                    <span class="text-xs text-gray-500 font-mono">PTS: ${totalPoints}</span>
                `;
                dateCard.appendChild(dateHeader);
                
                dateRecords.forEach(rec => {
                    const recordDiv = document.createElement('div');
                    recordDiv.className = "border-t border-gray-700 pt-2 mt-2";
                    
                    const timeDiv = document.createElement('div');
                    timeDiv.className = "flex justify-between text-[10px] text-gray-400 mb-1 font-mono";
                    const recTime = new Date(rec.date).toLocaleTimeString([], {hour: '2-digit', minute:'2-digit'});
                    timeDiv.innerHTML = `<span>${recTime}</span><span>${rec.completedCount} pts</span>`;
                    recordDiv.appendChild(timeDiv);
                    
                    if(rec.tasks && rec.tasks.length > 0) {
                        rec.tasks.forEach(t => {
                            if(t.text) {
                                const taskDiv = document.createElement('div');

                    if(rec.sideTasks && rec.sideTasks.length) {
                        const sideHeader = document.createElement('div');
                        sideHeader.className = "mt-2 text-[10px] text-cyan uppercase font-mono";

                    dateCard.appendChild(recordDiv);
                });
                list.appendChild(dateCard);
            });

        function formatDisplayDate(dateStr) {

        // --- RPG & SYSTEM ---
        const GAME = {
            titles: ['rank_1', 'rank_2', 'rank_3', 'rank_4', 'rank_5', 'rank_6'],

            nextLevelXp: (lvl) => 100 * Math.pow(lvl, 2),
            addXp: (amount, el) => {
                STATE.user.xp += amount;
                if(el) showFloatingText(`+${amount} XP`, el);
                saveSystem();
                updateUserStats();
            }
        };

        function updateUserStats() {
            const lvl = GAME.calculateLevel(STATE.user.xp);
            const nextXp = GAME.nextLevelXp(lvl);
            const prevXp = GAME.nextLevelXp(lvl - 1);
            const percent = Math.min(100, Math.max(0, ((STATE.user.xp - prevXp) / (nextXp - prevXp)) * 100));
            document.getElementById('userLevel').innerText = lvl;
            document.getElementById('currentXp').innerText = STATE.user.xp;
            document.getElementById('nextLevelXp').innerText = nextXp;
            document.getElementById('xpBar').style.width = `${percent}%`;
            document.getElementById('userTitle').innerText = t(GAME.titles[Math.min(lvl - 1, GAME.titles.length - 1)]);
        }

        // GM Functions
        function gmAddXp() { GAME.addXp(500); }
        function gmResetTimer() { triggerStop(); }
        function gmClearData() {
            if(confirm("WIPE ALL DATA?")) {
                localStorage.clear();
                location.reload();
            }
        }

        function showFloatingText(text, sourceElement) {
            const float = document.createElement('div');
            float.innerText = text;
            float.className = 'fixed text-amber font-bold pointer-events-none z-[999] text-lg animate-[floatUp_1s_ease-out_forwards] font-display';
            const rect = sourceElement.getBoundingClientRect();
            float.style.left = `${rect.left + rect.width/2}px`;
            float.style.top = `${rect.top}px`;
            document.body.appendChild(float);
            setTimeout(() => float.remove(), 1000);
        }

        function t(k) { return DICTIONARY[currentLang][k] || k; }
        function saveSystem() { 
            localStorage.setItem('cyber_user', JSON.stringify(STATE.user));
            localStorage.setItem('cyber_tasks', JSON.stringify(STATE.tasks));
            localStorage.setItem('cyber_side_tasks', JSON.stringify(STATE.sideTasks));
            localStorage.setItem('cyber_history', JSON.stringify(STATE.history));
            localStorage.setItem('cyber_lang', currentLang);
            localStorage.setItem('cyber_timer_v35', JSON.stringify(STATE.timer));
        }
        function toggleLang() { currentLang = currentLang==='zh'?'en':'zh'; document.getElementById('langBtn').innerText=currentLang==='zh'?'EN':'中'; saveSystem(); renderText(); }
        function renderText() {
            document.querySelectorAll('[data-i18n]').forEach(el => el.innerText = t(el.dataset.i18n));
            updateUserStats();
            // Re-render dynamic text
            const tab = STATE.activeTab;
            const guideEl = document.getElementById('taskGuide');
            if(tab === 'primary') {
                guideEl.innerHTML = `<span class="animate-pulse">⚠️</span> ${t('guide_main')}`;
            } else {
                guideEl.innerHTML = `<span class="animate-pulse">⚡</span> ${t('guide_side')}`;
            }
        }
        function showDialog(t,b,cb,c=true,e=null) {
            AudioSys.sfx.click();
            document.getElementById('dialogTitle').innerText = t; document.getElementById('dialogBody').innerText = b;
            const cbBtn = document.getElementById('dialogConfirm');
            const newCb = cbBtn.cloneNode(true); cbBtn.parentNode.replaceChild(newCb, cbBtn);
            newCb.onclick = ()=>{closeDialog();if(cb)cb()};
            document.getElementById('dialogCancel').style.display=c?'block':'none';
            const exDiv = document.getElementById('dialogExtra'); exDiv.innerHTML='';
            if(e){exDiv.classList.remove('hidden');exDiv.appendChild(e);}else exDiv.classList.add('hidden');
            document.getElementById('dialogModal').classList.remove('hidden');
        }
        function closeDialog(){document.getElementById('dialogModal').classList.add('hidden');}
        function closeModal(id){AudioSys.sfx.click();document.getElementById(id).classList.add('hidden');}

        // --- INIT ---
        (function init(){
            document.addEventListener('touchstart', unlockAudio, {once:true});
            document.addEventListener('click', unlockAudio, {once:true});
            
            if (STATE.timer.active && STATE.timer.endTime) {
                const now = Date.now();
                if (now >= STATE.timer.endTime) {
                    STATE.timer.active = false;
                    STATE.timer.pausedLeft = 0;
                    completeTimer(); 
                } else {
                    timerTicker = setInterval(tick, 1000);
                    tick();
                }
            } else {
                updateTimerUI(STATE.timer.pausedLeft);
            }

            updateRealTime();
            setInterval(updateRealTime, 1000);

            renderTasks();
            updateUserStats();
            renderText();
            
            document.querySelectorAll('.checklist-item').forEach(cb => cb.addEventListener('change', checkGatekeeper));
            document.querySelectorAll('.cyber-check').forEach(cb => cb.addEventListener('change', function() {
                AudioSys.sfx.check();
            }));
            document.addEventListener('keypress', (e)=>{if(e.key==='Enter'&&document.activeElement.id==='newSideTask')addSideTask()});
            
            const style = document.createElement('style');
            style.innerHTML = `@keyframes floatUp { 0% { opacity:1; transform: translateY(0); } 100% { opacity:0; transform: translateY(-30px); } }`;
            document.head.appendChild(style);
        })();
    </script>

    <!-- GM / DEV TOOLS (Hidden) -->
    <div class="gm-toggle" onclick="document.querySelector('.gm-panel').classList.toggle('open')" style="position:fixed; bottom:20px; right:20px; width:40px; height:40px; background:rgba(0,0,0,0.8); border:1px solid #333; color:#333; font-size:10px; display:grid; place-items:center; cursor:pointer; z-index:10001; opacity:0.3;">GM</div>
    <div class="gm-panel" style="position:fixed; bottom:20px; right:20px; width:300px; background:#111; border:1px solid var(--neon-amber); transform:translateY(120%); transition:transform 0.3s; z-index:10000; padding:1rem;">
        <div class="text-neon-amber mb-3 font-bold border-b border-gray-700 pb-1">GOD_MODE // DEBUG</div>
        <div class="grid grid-cols-2 gap-2">
            <button onclick="gmAddXp()" class="border border-gray-600 p-2 hover:bg-gray-800 text-left text-xs text-gray-400">ADD 500 XP</button>
            <button onclick="gmResetTimer()" class="border border-gray-600 p-2 hover:bg-gray-800 text-left text-xs text-gray-400">RESET TIMER</button>
            <button onclick="gmClearData()" class="col-span-2 border border-red-900 text-red-500 p-2 hover:bg-red-900/20 text-center text-xs">WIPE LOCAL DATA</button>
        </div>
    </div>
    <style>.gm-panel.open { transform: translateY(0); }</style>
</body>
</html>
