<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <title>CYBER FOCUS // HUD v3.1</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@400;500;700;900&family=Share+Tech+Mono&family=Noto+Sans+SC:wght@400;700&display=swap" rel="stylesheet">
    <script src="https://cdn.jsdelivr.net/npm/canvas-confetti@1.6.0/dist/confetti.browser.min.js"></script>
    
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    colors: {
                        void: '#050505',
                        cyan: '#00f3ff',
                        pink: '#ff0055',
                        green: '#0aff00',
                        amber: '#ffaa00',
                    },
                    fontFamily: {
                        display: ['Orbitron', 'sans-serif'],
                        mono: ['Share Tech Mono', 'monospace'],
                        sc: ['Noto Sans SC', 'sans-serif'],
                    }
                }
            }
        }
    </script>

    <style>
        :root {
            --bg-void: #050505;
            --neon-cyan: #00f3ff;
            --neon-pink: #ff0055;
            --neon-green: #0aff00;
            --neon-amber: #ffaa00;
            --grid-color: rgba(0, 243, 255, 0.1);
            --hud-bg: rgba(10, 20, 30, 0.92);
            --scan-line: rgba(255, 255, 255, 0.02);
        }

        body {
            background-color: var(--bg-void);
            background-image: 
                linear-gradient(var(--grid-color) 1px, transparent 1px),
                linear-gradient(90deg, var(--grid-color) 1px, transparent 1px);
            background-size: 30px 30px;
            color: var(--neon-cyan);
            font-family: 'Share Tech Mono', 'Noto Sans SC', monospace;
            min-height: 100vh;
            overflow-x: hidden;
            -webkit-tap-highlight-color: transparent;
        }

        /* 移动端触摸优化 */
        button, input, .chip { touch-action: manipulation; }

        /* CRT Scanline Effect */
        body::after {
            content: "";
            position: fixed;
            top: 0; left: 0; width: 100vw; height: 100vh;
            background: repeating-linear-gradient(0deg, var(--scan-line), var(--scan-line) 1px, transparent 1px, transparent 2px);
            pointer-events: none;
            z-index: 9999;
            opacity: 0.7;
        }

        /* HUD Panels */
        .hud-panel {
            background: var(--hud-bg);
            border: 1px solid rgba(0, 243, 255, 0.2);
            box-shadow: 0 0 15px rgba(0, 243, 255, 0.05);
            backdrop-filter: blur(8px);
            position: relative;
            clip-path: polygon(0 10px, 10px 0, calc(100% - 10px) 0, 100% 10px, 100% calc(100% - 10px), calc(100% - 10px) 100%, 10px 100%, 0 calc(100% - 10px));
            transition: all 0.3s ease;
        }

        .hud-panel::before {
            content: ''; position: absolute; inset: 0; pointer-events: none;
            background: linear-gradient(to right, var(--neon-cyan) 2px, transparent 2px) 0 0, linear-gradient(to bottom, var(--neon-cyan) 2px, transparent 2px) 0 0, linear-gradient(to left, var(--neon-cyan) 2px, transparent 2px) 100% 100%, linear-gradient(to top, var(--neon-cyan) 2px, transparent 2px) 100% 100%;
            background-repeat: no-repeat; background-size: 8px 8px; opacity: 0.6;
        }

        /* Typography */
        h1, h2, h3, .hud-title { font-family: 'Orbitron', 'Noto Sans SC', sans-serif; text-transform: uppercase; letter-spacing: 0.05em; }
        .glitch-text { text-shadow: 2px 0 rgba(255,0,0,0.5), -2px 0 rgba(0,255,255,0.5); }

        /* XP Bar */
        .xp-container { height: 4px; background: #111; border: 1px solid #333; position: relative; overflow: hidden; }
        .xp-fill { height: 100%; background: var(--neon-amber); width: 0%; box-shadow: 0 0 10px var(--neon-amber); transition: width 0.5s ease-out; }

        /* Mobile Inputs */
        .cyber-input {
            background: rgba(0,0,0,0.6); border: 1px solid #333; color: var(--neon-cyan);
            font-family: inherit; transition: 0.3s; border-radius: 0; appearance: none;
        }
        .cyber-input:focus { outline: none; border-color: var(--neon-cyan); box-shadow: 0 0 10px rgba(0, 243, 255, 0.2); }
        .cyber-input:disabled { opacity: 0.5; color: var(--neon-green); border-color: transparent; }
        
        /* Buttons */
        .btn-cyber {
            background: rgba(0, 243, 255, 0.05); border: 1px solid var(--neon-cyan); color: var(--neon-cyan);
            text-transform: uppercase; font-family: 'Orbitron', sans-serif; transition: all 0.2s;
            position: relative; overflow: hidden; letter-spacing: 1px;
            min-height: 44px; display: flex; align-items: center; justify-content: center;
        }
        .btn-cyber:active { background: var(--neon-cyan); color: #000; box-shadow: 0 0 20px var(--neon-cyan); }
        .btn-alert { border-color: var(--neon-pink); color: var(--neon-pink); background: rgba(255, 0, 85, 0.05); }
        .btn-alert:active { background: var(--neon-pink); color: #fff; box-shadow: 0 0 20px var(--neon-pink); }

        /* Timer Ring */
        .ring-bg { stroke: rgba(255,255,255,0.05); }
        .ring-progress { transition: stroke-dashoffset 1s linear, stroke 0.3s; filter: drop-shadow(0 0 4px currentColor); }

        /* Modals */
        .modal-overlay { background: rgba(0,0,0,0.95); backdrop-filter: blur(5px); transition: opacity 0.3s; }
        
        /* Checkboxes */
        .cyber-check {
            appearance: none; width: 24px; height: 24px; border: 1px solid var(--neon-cyan);
            background: transparent; display: grid; place-content: center; margin-right: 10px;
        }
        .cyber-check::before {
            content: ""; width: 14px; height: 14px; transform: scale(0);
            background: var(--neon-cyan); transition: 120ms transform ease-in-out;
            box-shadow: 0 0 10px var(--neon-cyan);
        }
        .cyber-check:checked::before { transform: scale(1); }

        /* Floating XP Text */
        @keyframes floatUp { 0% { opacity: 1; transform: translateY(0); } 100% { opacity: 0; transform: translateY(-30px); } }
        .xp-float { position: absolute; color: var(--neon-amber); font-weight: bold; pointer-events: none; animation: floatUp 1.5s forwards; z-index: 50; text-shadow: 0 0 5px black; font-size: 1.2rem; }

        /* GM Panel */
        .gm-panel {
            position: fixed; bottom: 0; right: 0; width: 100%; max-width: 320px;
            background: #0a0a0a; border-top: 2px solid var(--neon-amber); border-left: 2px solid var(--neon-amber);
            transform: translateY(110%); transition: transform 0.3s cubic-bezier(0.175, 0.885, 0.32, 1.275);
            z-index: 10000; padding: 20px; box-shadow: -5px -5px 20px rgba(0,0,0,0.8);
        }
        .gm-panel.open { transform: translateY(0); }
        .gm-toggle {
            position: fixed; bottom: 20px; right: 20px;
            width: 40px; height: 40px; background: #000; border: 1px solid #333; color: #333;
            font-size: 10px; display: grid; place-items: center; cursor: pointer; z-index: 9000; opacity: 0.5;
        }
        .gm-toggle:active, .gm-toggle:hover { opacity: 1; border-color: var(--neon-amber); color: var(--neon-amber); }

        .safe-pb { padding-bottom: max(80px, env(safe-area-inset-bottom)); } /* Added extra padding for GM button */
    </style>
</head>
<body class="p-3 md:p-6 max-w-5xl mx-auto flex flex-col gap-4 safe-pb" onclick="initAudioContext()">

    <!-- Header & Stats -->
    <header class="flex flex-col gap-3 border-b border-gray-800 pb-3">
        <div class="flex justify-between items-start">
            <div>
                <div class="text-[10px] text-gray-500 mb-0 tracking-[0.2em] flex items-center gap-2">
                    <span class="w-2 h-2 bg-green-500 rounded-full animate-pulse"></span>
                    <span data-i18n="system_online">系统在线</span>
                </div>
                <h1 class="text-2xl md:text-4xl font-bold glitch-text flex items-center gap-2">
                    FOCUS_OS <span class="text-xs align-top opacity-50 bg-cyan-900/30 px-1 rounded">v3.1</span>
                </h1>
            </div>
            <div class="flex gap-2">
                <button onclick="toggleLang()" class="border border-gray-700 px-2 py-1 text-[10px] hover:border-cyan hover:text-cyan transition" id="langBtn">EN</button>
                <button onclick="openHistory()" class="border border-gray-700 px-2 py-1 text-[10px] hover:border-amber hover:text-amber transition" data-i18n="history_btn">档案</button>
            </div>
        </div>

        <!-- RPG Stats Bar -->
        <div class="flex items-center gap-3 text-xs font-mono">
            <div class="text-amber">LVL <span id="userLevel" class="text-base font-bold">1</span></div>
            <div class="flex-1 flex flex-col gap-1">
                <div class="flex justify-between text-[10px] text-gray-400">
                    <span id="userTitle" class="text-cyan">义体乞丐</span>
                    <span><span id="currentXp">0</span> / <span id="nextLevelXp">100</span> XP</span>
                </div>
                <div class="xp-container">
                    <div id="xpBar" class="xp-fill"></div>
                </div>
            </div>
        </div>
    </header>

    <main class="grid grid-cols-1 md:grid-cols-2 gap-4 relative">
        
        <!-- MODULE: TIMER -->
        <div class="flex flex-col gap-4">
            <div class="hud-panel p-4 relative overflow-hidden group">
                <div class="absolute top-2 right-2 text-[10px] text-gray-600 border border-gray-800 px-1" data-i18n="module_timer">计时核心</div>
                
                <!-- Timer Vis -->
                <div class="relative w-56 h-56 mx-auto flex items-center justify-center my-4">
                    <svg class="w-full h-full transform -rotate-90">
                        <circle class="ring-bg" cx="112" cy="112" r="100" stroke-width="4" fill="none"></circle>
                        <circle id="progressRing" class="ring-progress" cx="112" cy="112" r="100" stroke-width="6" fill="none" stroke="var(--neon-cyan)" stroke-dasharray="628" stroke-dashoffset="0"></circle>
                    </svg>
                    
                    <div class="absolute inset-0 flex flex-col items-center justify-center z-10">
                        <div id="modeLabel" class="text-[10px] tracking-[0.2em] text-gray-400 mb-1" data-i18n="status_idle">待机</div>
                        <div id="timerDisplay" class="text-5xl font-mono font-bold tracking-tighter text-white drop-shadow-[0_0_10px_rgba(255,255,255,0.5)]">00:00</div>
                        
                        <div class="flex gap-4 mt-4">
                            <button id="mainActionBtn" onclick="toggleTimer()" class="w-12 h-12 border border-neon-cyan text-neon-cyan active:bg-neon-cyan active:text-black flex items-center justify-center rounded-sm transition shadow-[0_0_15px_rgba(0,243,255,0.2)] text-xl">
                                ▶
                            </button>
                            <button onclick="resetTimer()" class="w-12 h-12 border border-red-500 text-red-500 active:bg-red-500 active:text-black flex items-center justify-center rounded-sm transition text-xl">
                                ■
                            </button>
                        </div>
                    </div>
                </div>

                <!-- Timer Controls -->
                <div class="grid grid-cols-4 gap-2">
                    <button onclick="preFlightCheck(90, 'sprint')" class="timer-preset btn-cyber py-1 text-xs font-bold leading-tight" data-mode="sprint">90m<br><span class="text-[8px] opacity-70" data-i18n="mode_deep">深潜</span></button>
                    <button onclick="setTimerDirect(25, 'pomodoro')" class="timer-preset btn-cyber py-1 text-xs font-bold leading-tight" data-mode="pomodoro">25m<br><span class="text-[8px] opacity-70" data-i18n="mode_skirmish">突袭</span></button>
                    <button onclick="setTimerDirect(15, 'break')" class="timer-preset btn-alert py-1 text-xs font-bold leading-tight" data-mode="break">15m<br><span class="text-[8px] opacity-70" data-i18n="mode_reboot">重启</span></button>
                    <button onclick="setTimerDirect(5, 'short')" class="timer-preset btn-alert py-1 text-xs font-bold leading-tight" data-mode="short">05m<br><span class="text-[8px] opacity-70" data-i18n="mode_cool">冷却</span></button>
                </div>
            </div>

            <!-- Chips / Manual Overrides -->
            <div class="hud-panel p-3 flex justify-between items-center">
                <span class="text-[10px] text-amber tracking-widest" data-i18n="chips_label">神经芯片</span>
                <div class="flex gap-3">
                    <div class="chip w-10 h-10 border border-amber bg-amber/10 active:bg-amber active:text-black transition-all cursor-pointer flex items-center justify-center text-[10px] font-bold text-amber opacity-30" onclick="toggleChip(this)">α</div>
                    <div class="chip w-10 h-10 border border-amber bg-amber/10 active:bg-amber active:text-black transition-all cursor-pointer flex items-center justify-center text-[10px] font-bold text-amber opacity-30" onclick="toggleChip(this)">β</div>
                    <div class="chip w-10 h-10 border border-amber bg-amber/10 active:bg-amber active:text-black transition-all cursor-pointer flex items-center justify-center text-[10px] font-bold text-amber opacity-30" onclick="toggleChip(this)">γ</div>
                </div>
            </div>
        </div>

        <!-- MODULE: TASKS -->
        <div class="flex flex-col gap-4 h-full">
            <div class="hud-panel p-4 flex-1 flex flex-col">
                <div class="flex justify-between items-start mb-4">
                    <div>
                        <h2 class="text-xl text-white" data-i18n="objectives_title">主要目标</h2>
                        <p class="text-[10px] text-gray-500 font-mono mt-1" data-i18n="objectives_subtitle">协议: 单日上限 3 项任务</p>
                    </div>
                    <div class="text-right">
                        <div id="taskProgress" class="text-3xl font-display text-gray-700">0/3</div>
                    </div>
                </div>

                <div id="taskList" class="flex-1 flex flex-col gap-3">
                    <!-- Tasks injected via JS -->
                </div>

                <!-- Archive Button -->
                <button onclick="archiveDay()" class="mt-4 w-full py-3 border border-gray-700 text-gray-500 hover:text-cyan hover:border-cyan text-xs tracking-widest uppercase transition" data-i18n="archive_day_btn">
                    >> 归档今日数据 <<
                </button>
            </div>
        </div>

    </main>

    <!-- MODAL: FLOW CHECK -->
    <div id="flowCheckModal" class="fixed inset-0 modal-overlay z-50 hidden flex items-center justify-center p-4">
        <div class="hud-panel w-full max-w-md p-6 border-cyan transform transition-all scale-100 bg-black">
            <h2 class="text-xl text-cyan mb-2 text-center" data-i18n="modal_dive_title">启动深潜模式</h2>
            <p class="text-center text-gray-400 text-[10px] font-mono mb-6" data-i18n="modal_dive_subtitle">引擎启动前检查清单</p>
            
            <div class="space-y-3 mb-6">
                <label class="flex items-center gap-3 p-3 border border-gray-800 active:border-cyan transition bg-void/50 cursor-pointer group">
                    <input type="checkbox" class="cyber-check checklist-item">
                    <div class="flex-1">
                        <div class="text-sm font-bold text-white group-active:text-cyan" data-i18n="check_target">目标锁定</div>
                        <div class="text-[10px] text-gray-500" data-i18n="check_target_desc">单一明确的目标。</div>
                    </div>
                </label>
                <label class="flex items-center gap-3 p-3 border border-gray-800 active:border-cyan transition bg-void/50 cursor-pointer group">
                    <input type="checkbox" class="cyber-check checklist-item">
                    <div class="flex-1">
                        <div class="text-sm font-bold text-white group-active:text-cyan" data-i18n="check_silence">通讯静默</div>
                        <div class="text-[10px] text-gray-500" data-i18n="check_silence_desc">手机勿扰，关闭通知。</div>
                    </div>
                </label>
                <label class="flex items-center gap-3 p-3 border border-gray-800 active:border-cyan transition bg-void/50 cursor-pointer group">
                    <input type="checkbox" class="cyber-check checklist-item">
                    <div class="flex-1">
                        <div class="text-sm font-bold text-white group-active:text-cyan" data-i18n="check_bio">生理机能</div>
                        <div class="text-[10px] text-gray-500" data-i18n="check_bio_desc">水，咖啡，洗手间。</div>
                    </div>
                </label>
            </div>

            <div class="flex gap-3">
                <button onclick="closeModal('flowCheckModal')" class="flex-1 py-3 border border-gray-700 text-gray-500 text-xs font-mono uppercase" data-i18n="btn_abort">放弃</button>
                <button id="engageBtn" onclick="confirmStart()" class="flex-1 py-3 bg-cyan/10 border border-cyan text-cyan font-bold font-display uppercase tracking-widest opacity-50 cursor-not-allowed" disabled data-i18n="btn_engage">接入系统</button>
            </div>
        </div>
    </div>

    <!-- MODAL: HISTORY -->
    <div id="historyModal" class="fixed inset-0 modal-overlay z-50 hidden flex items-center justify-center p-4">
        <div class="hud-panel w-full max-w-lg h-[80vh] flex flex-col p-0 bg-black">
            <div class="p-4 border-b border-gray-800 flex justify-between items-center bg-gray-900/50">
                <h2 class="text-lg text-amber" data-i18n="history_title">数据档案馆</h2>
                <button onclick="closeModal('historyModal')" class="text-gray-500 hover:text-white text-xl">×</button>
            </div>
            <div id="historyList" class="flex-1 overflow-y-auto p-4 space-y-4 text-sm font-mono">
                <!-- History Items -->
            </div>
            <div class="p-3 border-t border-gray-800 text-center text-[10px] text-gray-600">
                CYBER_FOCUS // MEMORY_BANK
            </div>
        </div>
    </div>

    <!-- GM TOOLS -->
    <div class="gm-toggle" onclick="toggleGM()">GM</div>
    <div class="gm-panel" id="gmPanel">
        <div class="flex justify-between items-center text-amber mb-3 border-b border-gray-700 pb-2">
            <span class="font-bold">GOD_MODE // DEBUG</span>
            <button onclick="toggleGM()" class="text-gray-500">×</button>
        </div>
        <div class="grid grid-cols-2 gap-2 font-mono text-xs">
            <button onclick="gmResetTasks()" class="border border-gray-600 p-3 hover:bg-gray-800 text-left text-gray-300">重置任务状态</button>
            <button onclick="gmResetTimer()" class="border border-gray-600 p-3 hover:bg-gray-800 text-left text-gray-300">重置计时器</button>
            <button onclick="gmFastForward()" class="border border-gray-600 p-3 hover:bg-gray-800 text-left text-gray-300">快进 1 分钟</button>
            <button onclick="gmAddXp()" class="border border-gray-600 p-3 hover:bg-gray-800 text-left text-gray-300">给予 50 XP</button>
            <button onclick="gmClearStorage()" class="col-span-2 border border-red-900 text-red-500 p-3 hover:bg-red-900/20 text-center font-bold">警告：清空所有缓存</button>
        </div>
    </div>

    <script>
        // --- LOCALIZATION SYSTEM ---
        const DICTIONARY = {
            zh: {
                system_online: "系统在线",
                history_btn: "档案馆",
                module_timer: "计时核心",
                status_idle: "待机中",
                status_focus: "专注链接",
                status_break: "系统冷却",
                mode_deep: "深潜",
                mode_skirmish: "突袭",
                mode_reboot: "重启",
                mode_cool: "冷却",
                chips_label: "神经芯片",
                objectives_title: "主要目标",
                objectives_subtitle: "协议: 单日上限 3 项任务",
                archive_day_btn: ">> 归档今日数据 <<",
                modal_dive_title: "启动深潜模式",
                modal_dive_subtitle: "引擎启动前检查清单",
                check_target: "目标锁定",
                check_target_desc: "单一明确的目标。",
                check_silence: "通讯静默",
                check_silence_desc: "手机勿扰，关闭通知。",
                check_bio: "生理机能",
                check_bio_desc: "水，咖啡，洗手间。",
                btn_abort: "放弃",
                btn_engage: "接入系统",
                history_title: "数据档案馆",
                archive_confirm: "今日任务将归档并重置，确认执行？",
                archive_empty: "无数据可归档",
                task_ph: "> 输入任务指令...",
                rank_1: "义体乞丐", rank_2: "街头混混", rank_3: "赛博浪人", rank_4: "网络行者", rank_5: "传奇佣兵", rank_6: "荒坂塔顶"
            },
            en: {

                check_target_desc: "One clear goal defined.",
                check_silence: "COMMS SILENCED",

                check_bio: "BIO-METRICS",
                check_bio_desc: "Hydrated, caffeinated.",
                btn_abort: "ABORT",
                btn_engage: "ENGAGE",
                history_title: "DATA ARCHIVES",

                task_ph: "> INPUT DIRECTIVE...",
                rank_1: "STREET RAT", rank_2: "GUTTER PUNK", rank_3: "EDGE RUNNER", rank_4: "NET RUNNER", rank_5: "LEGEND", rank_6: "ARASAKA TOP"
            }
        };

        // --- AUDIO SYSTEM (Web Audio API) ---
        const AudioSys = {
            ctx: null,
            init: function() {
                if (!this.ctx) {
                    this.ctx = new (window.AudioContext || window.webkitAudioContext)();
                } else if (this.ctx.state === 'suspended') {
                    this.ctx.resume();
                }
            },
            playTone: function(freq, type, duration, vol = 0.1, startTime = 0) {
                if (!this.ctx) return;
                const osc = this.ctx.createOscillator();
                const gain = this.ctx.createGain();
                osc.type = type; 
                const t = startTime || this.ctx.currentTime;
                osc.frequency.setValueAtTime(freq, t);
                gain.gain.setValueAtTime(vol, t);
                gain.gain.exponentialRampToValueAtTime(0.01, t + duration);
                osc.connect(gain);
                gain.connect(this.ctx.destination);
                osc.start(t);
                osc.stop(t + duration);
            },
            sfx: {
                click: () => AudioSys.playTone(800, 'square', 0.1, 0.05),
                start: () => {
                    AudioSys.playTone(200, 'sawtooth', 0.5, 0.1);
                    setTimeout(() => AudioSys.playTone(400, 'sawtooth', 0.5, 0.1), 100);
                    setTimeout(() => AudioSys.playTone(800, 'sawtooth', 0.8, 0.1), 200);
                },
                alarm: () => {
                    // Distinct alarm sound for timer end
                    const now = AudioSys.ctx.currentTime;
                    // Pulse 1
                    AudioSys.playTone(880, 'square', 0.1, 0.2, now);
                    AudioSys.playTone(880, 'square', 0.1, 0.2, now + 0.15);
                    AudioSys.playTone(880, 'square', 0.4, 0.2, now + 0.3);
                    
                    // Pulse 2 (delayed)
                    AudioSys.playTone(880, 'square', 0.1, 0.2, now + 1.0);
                    AudioSys.playTone(880, 'square', 0.1, 0.2, now + 1.15);
                    AudioSys.playTone(880, 'square', 0.4, 0.2, now + 1.3);

                    // Vibrate phone if supported
                    if (navigator.vibrate) navigator.vibrate([200, 100, 200, 100, 500]);
                },
                xp: () => {
                    AudioSys.playTone(1200, 'sine', 0.1, 0.05);
                    setTimeout(() => AudioSys.playTone(1800, 'sine', 0.2, 0.05), 50);
                },
                levelUp: () => {
                     const osc = AudioSys.ctx.createOscillator();
                     const gain = AudioSys.ctx.createGain();
                     osc.frequency.setValueAtTime(100, AudioSys.ctx.currentTime);
                     osc.frequency.linearRampToValueAtTime(1000, AudioSys.ctx.currentTime + 1);
                     gain.gain.setValueAtTime(0.2, AudioSys.ctx.currentTime);
                     gain.gain.linearRampToValueAtTime(0, AudioSys.ctx.currentTime + 1);
                     osc.connect(gain); gain.connect(AudioSys.ctx.destination);
                     osc.start(); osc.stop(AudioSys.ctx.currentTime + 1);
                }
            }
        };

        function initAudioContext() { AudioSys.init(); }

        // --- GAME SYSTEM (RPG) ---
        const GAME = {
            titles: ['rank_1', 'rank_2', 'rank_3', 'rank_4', 'rank_5', 'rank_6'],
            calculateLevel: (xp) => Math.floor(Math.sqrt(xp / 100)) + 1,
            nextLevelXp: (lvl) => 100 * Math.pow(lvl, 2),
            addXp: (amount, eventType) => {
                STATE.user.xp += amount;
                const newLevel = GAME.calculateLevel(STATE.user.xp);
                showFloatingText(`+${amount} XP`, eventType);
                AudioSys.sfx.xp();
                if(newLevel > STATE.user.level) {
                    STATE.user.level = newLevel;
                    setTimeout(() => {
                        AudioSys.sfx.levelUp();
                        alert(`>>> SYSTEM UPGRADE <<<\nLEVEL ${newLevel} REACHED`);
                    }, 500);
                }
                saveSystem();
                updateUserStats();
            }
        };

        // --- CORE STATE ---
        let currentLang = localStorage.getItem('cyber_lang') || 'zh';
        
        const STATE = {
            user: JSON.parse(localStorage.getItem('cyber_user')) || { xp: 0, level: 1 },
            tasks: JSON.parse(localStorage.getItem('cyber_tasks')) || [
                { id: 1, text: '', done: false }, { id: 2, text: '', done: false }, { id: 3, text: '', done: false }
            ],
            history: JSON.parse(localStorage.getItem('cyber_history')) || [],
            timer: {
                totalSeconds: 5400,
                remaining: 5400,
                active: false,
                mode: 'sprint',
                interval: null
            }
        };

        const UI = {
            timerDisplay: document.getElementById('timerDisplay'),
            ring: document.getElementById('progressRing'),
            modeLabel: document.getElementById('modeLabel'),
            taskList: document.getElementById('taskList'),
            modal: document.getElementById('flowCheckModal'),
            engageBtn: document.getElementById('engageBtn')
        };

        const CONFIG = {
            sprint: { time: 90 * 60, color: '#00f3ff', labelKey: 'mode_deep' },
            pomodoro: { time: 25 * 60, color: '#00f3ff', labelKey: 'mode_skirmish' },
            break: { time: 15 * 60, color: '#0aff00', labelKey: 'mode_reboot' },
            short: { time: 5 * 60, color: '#0aff00', labelKey: 'mode_cool' }
        };

        // --- FUNCTIONS ---

        function t(key) { return DICTIONARY[currentLang][key] || key; }

        function renderText() {
            document.querySelectorAll('[data-i18n]').forEach(el => {
                el.innerText = t(el.dataset.i18n);
            });
            document.querySelectorAll('input[placeholder]').forEach(el => {
               if(el.id.includes('taskInput')) el.placeholder = t('task_ph');
            });
            document.getElementById('langBtn').innerText = currentLang === 'zh' ? 'EN' : '中';
            updateUserStats();
            updateTimerLabel();
        }

        function toggleLang() {
            currentLang = currentLang === 'zh' ? 'en' : 'zh';
            localStorage.setItem('cyber_lang', currentLang);
            AudioSys.sfx.click();
            renderText();
        }

        function init() {
            // FIX: Sanitize tasks on init to prevent "stuck" inputs
            // If a task has no text, it CANNOT be done.
            STATE.tasks = STATE.tasks.map(task => ({
                ...task,
                done: task.text && task.text.trim() !== '' ? task.done : false
            }));
            saveSystem();

            renderTasks();
            updateTimerDisplay();
            updateUserStats();
            renderText();
            
            document.querySelectorAll('.checklist-item').forEach(cb => {
                cb.addEventListener('change', () => {
                    AudioSys.sfx.click();
                    checkGatekeeper();
                });
            });
        }

        function saveSystem() {
            localStorage.setItem('cyber_tasks', JSON.stringify(STATE.tasks));
            localStorage.setItem('cyber_user', JSON.stringify(STATE.user));
            localStorage.setItem('cyber_history', JSON.stringify(STATE.history));
        }

        // --- RPG UI ---
        function updateUserStats() {
            const lvl = GAME.calculateLevel(STATE.user.xp);
            const nextXp = GAME.nextLevelXp(lvl);
            const prevXp = GAME.nextLevelXp(lvl - 1);
            const levelRange = nextXp - prevXp;
            const currentProgress = STATE.user.xp - prevXp;
            const percent = Math.min(100, Math.max(0, (currentProgress / levelRange) * 100));

            document.getElementById('userLevel').innerText = lvl;
            document.getElementById('currentXp').innerText = STATE.user.xp;
            document.getElementById('nextLevelXp').innerText = nextXp;
            document.getElementById('xpBar').style.width = `${percent}%`;
            
            const titleIndex = Math.min(lvl - 1, GAME.titles.length - 1);
            document.getElementById('userTitle').innerText = t(GAME.titles[titleIndex]);
        }

        function showFloatingText(text, sourceElement) {
            const float = document.createElement('div');
            float.className = 'xp-float';
            float.innerText = text;
            let x, y;
            if(sourceElement) {
                const rect = sourceElement.getBoundingClientRect();
                x = rect.left + rect.width / 2;
                y = rect.top;
            } else {
                x = window.innerWidth / 2;
                y = window.innerHeight / 2;
            }
            float.style.left = `${x}px`;
            float.style.top = `${y}px`;
            document.body.appendChild(float);
            setTimeout(() => float.remove(), 1500);
        }

        // --- TIMER ENGINE ---
        function updateTimerDisplay() {
            const m = Math.floor(STATE.timer.remaining / 60);
            const s = STATE.timer.remaining % 60;
            UI.timerDisplay.textContent = `${String(m).padStart(2,'0')}:${String(s).padStart(2,'0')}`;
            
            const circumference = 628;
            const offset = circumference - (STATE.timer.remaining / STATE.timer.totalSeconds) * circumference;
            UI.ring.style.strokeDashoffset = offset;
            
            const currentConfig = CONFIG[STATE.timer.mode];
            UI.ring.style.stroke = currentConfig.color;
        }

        function updateTimerLabel() {
            const currentConfig = CONFIG[STATE.timer.mode];
            UI.modeLabel.textContent = STATE.timer.active ? t('status_focus') : t(currentConfig.labelKey);
            UI.modeLabel.style.color = currentConfig.color;
        }

        function toggleTimer() {
            AudioSys.sfx.click();
            if (STATE.timer.active) {
                clearInterval(STATE.timer.interval);
                STATE.timer.active = false;
                document.getElementById('mainActionBtn').innerHTML = '▶';
                updateTimerLabel();
            } else {
                if (STATE.timer.remaining <= 0) return;
                startTicker();
            }
        }

        function startTicker() {
            STATE.timer.active = true;
            document.getElementById('mainActionBtn').innerHTML = '❚❚';
            updateTimerLabel();
            AudioSys.sfx.start();
            
            STATE.timer.interval = setInterval(() => {
                if (STATE.timer.remaining > 0) {
                    STATE.timer.remaining--;
                    updateTimerDisplay();
                } else {
                    completeTimer();
                }
            }, 1000);
        }

        function completeTimer() {
            clearInterval(STATE.timer.interval);
            STATE.timer.active = false;
            document.getElementById('mainActionBtn').innerHTML = '▶';
            
            // Enhanced Alarm Sound
            AudioSys.sfx.alarm();
            
            const minutes = STATE.timer.totalSeconds / 60;
            const xpEarned = Math.floor(minutes * 2);
            GAME.addXp(xpEarned, UI.timerDisplay);

            confetti({ particleCount: 150, spread: 70, origin: { y: 0.6 }, colors: ['#00f3ff', '#ff0055'] });
            
            updateTimerLabel();
        }

        function resetTimer() {
            AudioSys.sfx.click();
            clearInterval(STATE.timer.interval);
            STATE.timer.active = false;
            STATE.timer.remaining = STATE.timer.totalSeconds;
            document.getElementById('mainActionBtn').innerHTML = '▶';
            updateTimerDisplay();
            updateTimerLabel();
        }

        function setTimerDirect(min, mode) {
            AudioSys.sfx.click();
            clearInterval(STATE.timer.interval);
            STATE.timer.active = false;
            STATE.timer.mode = mode;
            STATE.timer.totalSeconds = min * 60;
            STATE.timer.remaining = min * 60;
            document.getElementById('mainActionBtn').innerHTML = '▶';
            updateTimerDisplay();
            updateTimerLabel();
        }

        function preFlightCheck(min, mode) {
            AudioSys.sfx.click();
            UI.modal.classList.remove('hidden');
            UI.modal.dataset.targetMin = min;
            UI.modal.dataset.targetMode = mode;
            document.querySelectorAll('.checklist-item').forEach(cb => cb.checked = false);
            checkGatekeeper();
        }

        function closeModal(id) {
            AudioSys.sfx.click();
            document.getElementById(id).classList.add('hidden');
        }

        function checkGatekeeper() {
            const allChecked = Array.from(document.querySelectorAll('.checklist-item')).every(cb => cb.checked);
            if (allChecked) {
                UI.engageBtn.disabled = false;
                UI.engageBtn.classList.remove('opacity-50', 'cursor-not-allowed');
                UI.engageBtn.classList.add('active:bg-cyan', 'active:text-black');
            } else {
                UI.engageBtn.disabled = true;
                UI.engageBtn.classList.add('opacity-50', 'cursor-not-allowed');
            }
        }

        function confirmStart() {
            const min = UI.modal.dataset.targetMin;
            const mode = UI.modal.dataset.targetMode;
            closeModal('flowCheckModal');
            setTimerDirect(min, mode);
            startTicker();
        }

        // --- TASK SYSTEM ---
        function renderTasks() {
            UI.taskList.innerHTML = '';
            let completed = 0;
            
            STATE.tasks.forEach((task, index) => {
                if(task.done) completed++;
                
                const div = document.createElement('div');
                div.className = `flex items-center gap-3 p-3 border transition-all duration-300 ${task.done ? 'border-neon-green bg-neon-green/10' : 'border-gray-800 bg-void/40 active:border-cyan'}`;
                
                div.innerHTML = `
                    <div class="font-mono text-xs opacity-50 w-4">0${index+1}</div>
                    <input type="text" 
                        id="taskInput_${index}"
                        value="${task.text}" 
                        class="flex-1 bg-transparent border-none outline-none text-white font-mono placeholder-gray-700 text-sm ${task.done ? 'line-through text-neon-green' : ''}"
                        placeholder="${t('task_ph')}"
                        onchange="updateTaskText(${index}, this.value)"
                        ${task.done ? 'disabled' : ''}
                    >
                    <button onclick="toggleTask(${index}, this)" class="w-8 h-8 border flex items-center justify-center transition ${task.done ? 'border-neon-green text-neon-green' : 'border-gray-700 text-gray-700 active:border-cyan active:text-cyan'}">
                        ${task.done ? '✓' : '⚡'}
                    </button>
                `;
                UI.taskList.appendChild(div);
            });
            
            const progressEl = document.getElementById('taskProgress');
            progressEl.textContent = `${completed}/3`;
            progressEl.className = `text-3xl font-display ${completed === 3 ? 'text-neon-green glitch-text' : 'text-gray-700'}`;
        }

        function updateTaskText(index, val) {
            STATE.tasks[index].text = val;
            // Safety: if text cleared, untick
            if(!val.trim()) STATE.tasks[index].done = false;
            saveSystem();
            if(!val.trim()) renderTasks(); // Re-render to enable input if needed
        }

        function toggleTask(index, btnEl) {
            AudioSys.sfx.click();
            // Allow unticking even if disabled input, but don't allow ticking empty tasks
            if(!STATE.tasks[index].done && !STATE.tasks[index].text.trim()) return;

            STATE.tasks[index].done = !STATE.tasks[index].done;
            
            if(STATE.tasks[index].done) {
                AudioSys.playTone(600, 'sine', 0.1); // Small confirm
                GAME.addXp(50, btnEl);
            }

            saveSystem();
            renderTasks();
            updateUserStats();
        }

        function toggleChip(el) {
            AudioSys.sfx.click();
            if(el.style.opacity === '0.3' || el.style.opacity === '') {
                el.style.opacity = '1';
                el.style.transform = 'scale(1.1)';
                el.style.boxShadow = '0 0 10px #ffaa00';
            } else {
                el.style.opacity = '0.3';
                el.style.transform = 'scale(1)';
                el.style.boxShadow = 'none';
            }
        }

        // --- HISTORY ARCHIVE ---
        function archiveDay() {
            AudioSys.sfx.click();
            const hasContent = STATE.tasks.some(t => t.text.trim().length > 0);
            if(!hasContent) {
                alert(t('archive_empty'));
                return;
            }

            if(confirm(t('archive_confirm'))) {
                const now = new Date();
                const record = {
                    date: now.toISOString(),
                    tasks: JSON.parse(JSON.stringify(STATE.tasks)),
                    completedCount: STATE.tasks.filter(t => t.done).length
                };

                STATE.history.unshift(record);
                STATE.tasks.forEach(t => { t.text = ''; t.done = false; });
                saveSystem();
                renderTasks();
                AudioSys.sfx.xp();
            }
        }

        function openHistory() {
            AudioSys.sfx.click();
            const list = document.getElementById('historyList');
            list.innerHTML = '';
            
            if(STATE.history.length === 0) {
                list.innerHTML = `<div class="text-center text-gray-600 mt-10">NO DATA FOUND</div>`;
            } else {
                STATE.history.forEach(rec => {
                    const dateObj = new Date(rec.date);
                    const dateStr = dateObj.toLocaleDateString() + ' ' + dateObj.toLocaleTimeString([], {hour: '2-digit', minute:'2-digit'});
                    
                    const div = document.createElement('div');
                    div.className = 'border border-gray-800 p-3 bg-white/5 mb-2';
                    
                    let taskHtml = '';
                    rec.tasks.forEach(t => {
                        if(t.text) {
                            taskHtml += `<div class="flex gap-2 items-center text-xs text-gray-400">
                                <span class="${t.done ? 'text-neon-green' : 'text-red-500'}">${t.done ? '✓' : '×'}</span>
                                <span class="${t.done ? 'line-through' : ''}">${t.text}</span>
                            </div>`;
                        }
                    });

                    div.innerHTML = `
                        <div class="flex justify-between items-center mb-2 border-b border-gray-700 pb-1">
                            <span class="text-neon-cyan">${dateStr}</span>
                            <span class="text-xs ${rec.completedCount === 3 ? 'text-neon-green' : 'text-gray-500'}">SCORE: ${rec.completedCount}/3</span>
                        </div>
                        <div class="space-y-1">${taskHtml}</div>
                    `;
                    list.appendChild(div);
                });
            }
            document.getElementById('historyModal').classList.remove('hidden');
        }

        // --- GM TOOLS ---
        function toggleGM() {
            document.getElementById('gmPanel').classList.toggle('open');
        }
        function gmResetTasks() {
            STATE.tasks.forEach(t => { t.done = false; t.text = ''; });
            saveSystem();
            renderTasks();
            alert('SYSTEM: TASKS RESET');
        }
        function gmResetTimer() {
            resetTimer();
        }
        function gmFastForward() {
            if(STATE.timer.remaining > 60) {
                STATE.timer.remaining -= 60;
                updateTimerDisplay();
            }
        }
        function gmAddXp() {
            GAME.addXp(50);
        }
        function gmClearStorage() {
            if(confirm('WIPE ALL DATA?')) {
                localStorage.removeItem('cyber_tasks');
                localStorage.removeItem('cyber_maint');
                localStorage.removeItem('cyber_user');
                localStorage.removeItem('cyber_history');
                location.reload();
            }
        }

        // Boot
        init();
    </script>
</body>
</html>
