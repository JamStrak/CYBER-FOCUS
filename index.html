<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <title>CYBER FOCUS // HUD v3.2</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@400;500;700;900&family=Share+Tech+Mono&family=Noto+Sans+SC:wght@400;700&display=swap" rel="stylesheet">
    <script src="https://cdn.jsdelivr.net/npm/canvas-confetti@1.6.0/dist/confetti.browser.min.js"></script>
    
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    colors: {
                        void: '#050505',
                        cyan: '#00f3ff',
                        pink: '#ff0055',
                        green: '#0aff00',
                        amber: '#ffaa00',
                        dark: '#0a0f14'
                    },
                    fontFamily: {
                        display: ['Orbitron', 'sans-serif'],
                        mono: ['Share Tech Mono', 'monospace'],
                        sc: ['Noto Sans SC', 'sans-serif'],
                    }
                }
            }
        }
    </script>

    <style>
        :root {
            --bg-void: #050505;
            --neon-cyan: #00f3ff;
            --neon-pink: #ff0055;
            --neon-green: #0aff00;
            --neon-amber: #ffaa00;
            --hud-bg: rgba(10, 15, 20, 0.95);
        }

        body {
            background-color: var(--bg-void);
            background-image: 
                linear-gradient(rgba(0, 243, 255, 0.03) 1px, transparent 1px),
                linear-gradient(90deg, rgba(0, 243, 255, 0.03) 1px, transparent 1px);
            background-size: 20px 20px;
            color: var(--neon-cyan);
            font-family: 'Share Tech Mono', 'Noto Sans SC', monospace;
            min-height: 100vh;
            overflow-x: hidden;
            -webkit-tap-highlight-color: transparent;
            padding-bottom: env(safe-area-inset-bottom);
        }

        /* 移动端触摸优化 */
        button, input, .chip { touch-action: manipulation; }

        /* HUD Panels */
        .hud-panel {
            background: var(--hud-bg);
            border: 1px solid rgba(0, 243, 255, 0.15);
            box-shadow: 0 0 10px rgba(0, 0, 0, 0.5);
            position: relative;
            /* Tech Corners */
            clip-path: polygon(
                0 0, 
                100% 0, 
                100% calc(100% - 15px), 
                calc(100% - 15px) 100%, 
                0 100%
            );
        }

        /* Typography & Effects */
        .glitch-text { text-shadow: 2px 0 rgba(255,0,0,0.5), -2px 0 rgba(0,255,255,0.5); }
        
        /* XP Bar */
        .xp-container { height: 4px; background: #111; border: 1px solid #333; position: relative; overflow: hidden; }
        .xp-fill { height: 100%; background: var(--neon-amber); width: 0%; box-shadow: 0 0 10px var(--neon-amber); transition: width 0.5s ease-out; }

        /* Inputs & Buttons */
        .cyber-input {
            background: rgba(0,0,0,0.6); border: 1px solid #333; color: var(--neon-cyan);
            font-family: inherit; transition: 0.3s; border-radius: 0; appearance: none;
        }
        .cyber-input:focus { outline: none; border-color: var(--neon-cyan); }
        
        .btn-cyber {
            background: rgba(0, 243, 255, 0.05); border: 1px solid var(--neon-cyan); color: var(--neon-cyan);
            text-transform: uppercase; font-family: 'Orbitron', sans-serif; transition: all 0.2s;
            position: relative; overflow: hidden; letter-spacing: 1px;
            display: flex; align-items: center; justify-content: center;
        }
        .btn-cyber:active { background: var(--neon-cyan); color: #000; }
        
        .btn-green { border-color: var(--neon-green); color: var(--neon-green); background: rgba(10, 255, 0, 0.05); }
        .btn-green:active { background: var(--neon-green); color: #000; }

        .btn-alert { border-color: var(--neon-pink); color: var(--neon-pink); background: rgba(255, 0, 85, 0.05); }
        .btn-alert:active { background: var(--neon-pink); color: #fff; }

        /* Timer Ring */
        .ring-bg { stroke: rgba(255,255,255,0.05); }
        .ring-progress { transition: stroke-dashoffset 1s linear, stroke 0.3s; filter: drop-shadow(0 0 4px currentColor); }

        /* Modals */
        .modal-overlay { background: rgba(0,0,0,0.85); backdrop-filter: blur(4px); transition: opacity 0.2s; }
        .modal-content { 
            animation: modalIn 0.3s cubic-bezier(0.175, 0.885, 0.32, 1.275);
            box-shadow: 0 0 30px rgba(0, 243, 255, 0.1);
        }
        @keyframes modalIn { from { transform: scale(0.9) translateY(20px); opacity: 0; } to { transform: scale(1) translateY(0); opacity: 1; } }

        /* Checkboxes */
        .cyber-check {
            appearance: none; width: 20px; height: 20px; border: 1px solid var(--neon-cyan);
            background: transparent; display: grid; place-content: center; margin-right: 10px;
        }
        .cyber-check::before {
            content: ""; width: 10px; height: 10px; transform: scale(0);
            background: var(--neon-cyan); transition: 100ms transform ease-in-out;
        }
        .cyber-check:checked::before { transform: scale(1); }

        /* Tabs */
        .tab-btn { opacity: 0.4; border-bottom: 2px solid transparent; transition: all 0.3s; }
        .tab-btn.active { opacity: 1; border-color: var(--neon-cyan); color: var(--neon-cyan); text-shadow: 0 0 8px rgba(0, 243, 255, 0.5); }

        /* Floating XP */
        @keyframes floatUp { 0% { opacity: 1; transform: translateY(0); } 100% { opacity: 0; transform: translateY(-30px); } }
        .xp-float { position: absolute; color: var(--neon-amber); font-weight: bold; pointer-events: none; animation: floatUp 1.5s forwards; z-index: 999; text-shadow: 0 0 5px black; font-size: 1.2rem; }

        /* GM Panel */
        .gm-panel {
            position: fixed; bottom: 0; right: 0; width: 100%; max-width: 320px;
            background: #0a0a0a; border-top: 2px solid var(--neon-amber);
            transform: translateY(110%); transition: transform 0.3s;
            z-index: 10000; padding: 20px;
        }
        .gm-panel.open { transform: translateY(0); }
    </style>
</head>
<body class="p-3 md:p-6 max-w-5xl mx-auto flex flex-col gap-4 safe-pb" onclick="AudioSys.safeInit()">

    <!-- Header -->
    <header class="flex flex-col gap-3 border-b border-gray-800 pb-3">
        <div class="flex justify-between items-start">
            <div>
                <div class="text-[10px] text-gray-500 mb-0 tracking-[0.2em] flex items-center gap-2">
                    <span class="w-2 h-2 bg-green-500 rounded-full animate-pulse"></span>
                    <span data-i18n="system_online">系统在线</span>
                </div>
                <h1 class="text-2xl md:text-3xl font-bold glitch-text">FOCUS_OS <span class="text-xs opacity-50 bg-cyan-900/30 px-1 rounded">v3.2</span></h1>
            </div>
            <div class="flex gap-2">
                <button onclick="toggleLang()" class="border border-gray-700 px-2 py-1 text-[10px] hover:border-cyan transition" id="langBtn">EN</button>
                <button onclick="openHistory()" class="border border-gray-700 px-2 py-1 text-[10px] hover:border-amber hover:text-amber transition" data-i18n="history_btn">档案</button>
            </div>
        </div>

        <!-- RPG Stats -->
        <div class="flex items-center gap-3 text-xs font-mono">
            <div class="text-amber">LVL <span id="userLevel" class="text-base font-bold">1</span></div>
            <div class="flex-1 flex flex-col gap-1">
                <div class="flex justify-between text-[10px] text-gray-400">
                    <span id="userTitle" class="text-cyan">义体乞丐</span>
                    <span><span id="currentXp">0</span> / <span id="nextLevelXp">100</span> XP</span>
                </div>
                <div class="xp-container">
                    <div id="xpBar" class="xp-fill"></div>
                </div>
            </div>
        </div>
    </header>

    <main class="grid grid-cols-1 md:grid-cols-2 gap-4">
        
        <!-- MODULE: TIMER -->
        <div class="flex flex-col gap-4">
            <div class="hud-panel p-4 relative overflow-hidden">
                <div class="absolute top-2 right-2 text-[10px] text-gray-600 border border-gray-800 px-1" data-i18n="module_timer">计时核心</div>
                
                <!-- Timer Ring -->
                <div class="relative w-56 h-56 mx-auto flex items-center justify-center my-4">
                    <svg class="w-full h-full transform -rotate-90">
                        <circle class="ring-bg" cx="112" cy="112" r="100" stroke-width="4" fill="none"></circle>
                        <circle id="progressRing" class="ring-progress" cx="112" cy="112" r="100" stroke-width="6" fill="none" stroke="var(--neon-cyan)" stroke-dasharray="628" stroke-dashoffset="0"></circle>
                    </svg>
                    
                    <div class="absolute inset-0 flex flex-col items-center justify-center z-10">
                        <div id="modeLabel" class="text-[10px] tracking-[0.2em] text-gray-400 mb-1" data-i18n="status_idle">待机</div>
                        <div id="timerDisplay" class="text-5xl font-mono font-bold tracking-tighter text-white drop-shadow-[0_0_10px_rgba(255,255,255,0.5)]">00:00</div>
                        
                        <div class="flex gap-4 mt-4">
                            <!-- Play/Pause -->
                            <button id="mainActionBtn" onclick="toggleTimer()" class="w-14 h-14 bg-black border border-neon-cyan text-neon-cyan active:bg-neon-cyan active:text-black flex items-center justify-center transition shadow-[0_0_15px_rgba(0,243,255,0.2)] text-2xl clip-corner">
                                ▶
                            </button>
                            <!-- Stop / Early Finish -->
                            <button onclick="triggerStop()" class="w-14 h-14 bg-black border border-neon-pink text-neon-pink active:bg-neon-pink active:text-black flex items-center justify-center transition text-xl clip-corner">
                                ■
                            </button>
                        </div>
                    </div>
                </div>

                <!-- Controls -->
                <div class="grid grid-cols-4 gap-2">
                    <button onclick="checkTimerSafety(90, 'sprint')" class="timer-preset btn-cyber py-2 text-xs font-bold leading-tight" data-mode="sprint">90m<br><span class="text-[8px] opacity-70" data-i18n="mode_deep">深潜</span></button>
                    <button onclick="checkTimerSafety(25, 'pomodoro')" class="timer-preset btn-cyber py-2 text-xs font-bold leading-tight" data-mode="pomodoro">25m<br><span class="text-[8px] opacity-70" data-i18n="mode_skirmish">突袭</span></button>
                    <!-- Green/Amber for breaks, not red -->
                    <button onclick="checkTimerSafety(15, 'break')" class="timer-preset btn-green py-2 text-xs font-bold leading-tight" data-mode="break">15m<br><span class="text-[8px] opacity-70" data-i18n="mode_reboot">重启</span></button>
                    <button onclick="checkTimerSafety(5, 'short')" class="timer-preset btn-green py-2 text-xs font-bold leading-tight" data-mode="short">05m<br><span class="text-[8px] opacity-70" data-i18n="mode_cool">冷却</span></button>
                </div>
            </div>

            <!-- Chips -->
            <div class="hud-panel p-3 flex justify-between items-center">
                <span class="text-[10px] text-amber tracking-widest" data-i18n="chips_label">神经芯片</span>
                <div class="flex gap-3">
                    <div class="chip w-10 h-10 border border-amber bg-amber/10 active:bg-amber active:text-black transition-all cursor-pointer flex items-center justify-center text-[10px] font-bold text-amber opacity-30" onclick="toggleChip(this)">α</div>
                    <div class="chip w-10 h-10 border border-amber bg-amber/10 active:bg-amber active:text-black transition-all cursor-pointer flex items-center justify-center text-[10px] font-bold text-amber opacity-30" onclick="toggleChip(this)">β</div>
                    <div class="chip w-10 h-10 border border-amber bg-amber/10 active:bg-amber active:text-black transition-all cursor-pointer flex items-center justify-center text-[10px] font-bold text-amber opacity-30" onclick="toggleChip(this)">γ</div>
                </div>
            </div>
        </div>

        <!-- MODULE: TASKS -->
        <div class="flex flex-col gap-4 h-full">
            <div class="hud-panel p-4 flex-1 flex flex-col min-h-[400px]">
                
                <!-- Tab Switcher -->
                <div class="flex items-center gap-6 mb-4 border-b border-gray-800 pb-1">
                    <button onclick="switchTab('primary')" class="tab-btn text-sm font-bold uppercase tracking-widest active" id="tab-primary" data-i18n="tab_main">主线任务</button>
                    <button onclick="switchTab('side')" class="tab-btn text-sm font-bold uppercase tracking-widest" id="tab-side" data-i18n="tab_side">突发行动</button>
                    <div class="flex-1 text-right text-3xl font-display text-gray-700" id="taskProgress">0/3</div>
                </div>

                <!-- Task Description -->
                <p id="taskDesc" class="text-[10px] text-gray-500 font-mono mb-2" data-i18n="objectives_subtitle">协议: 单日上限 3 项任务</p>

                <div id="taskList" class="flex-1 flex flex-col gap-3 overflow-y-auto">
                    <!-- Tasks injected via JS -->
                </div>

                <!-- Archive Button -->
                <button onclick="archiveDay()" class="mt-4 w-full py-3 border border-gray-700 text-gray-500 hover:text-cyan hover:border-cyan text-xs tracking-widest uppercase transition" data-i18n="archive_day_btn">
                    >> 归档今日数据 <<
                </button>
            </div>
        </div>

    </main>

    <!-- UNIFIED DIALOG MODAL (Replaces Alert/Confirm) -->
    <div id="dialogModal" class="fixed inset-0 modal-overlay z-[100] hidden flex items-center justify-center p-6">
        <div class="hud-panel w-full max-w-sm p-0 bg-dark modal-content border-l-4 border-l-cyan">
            <div class="p-4 border-b border-gray-800">
                <h3 id="dialogTitle" class="text-lg font-bold text-white uppercase tracking-wider">SYSTEM ALERT</h3>
            </div>
            <div class="p-5">
                <div id="dialogBody" class="text-sm text-gray-300 font-mono mb-6 leading-relaxed">
                    Message goes here...
                </div>
                <!-- Dynamic Content for Debrief -->
                <div id="dialogExtra" class="mb-4 hidden"></div>

                <div class="flex gap-3 justify-end">
                    <button id="dialogCancel" class="px-4 py-2 border border-gray-700 text-gray-500 text-xs hover:text-white uppercase" onclick="closeDialog()">Cancel</button>
                    <button id="dialogConfirm" class="px-4 py-2 bg-cyan/10 border border-cyan text-cyan text-xs font-bold uppercase hover:bg-cyan hover:text-black transition">Confirm</button>
                </div>
            </div>
        </div>
    </div>

    <!-- LEVEL UP MODAL -->
    <div id="levelUpModal" class="fixed inset-0 modal-overlay z-[200] hidden flex items-center justify-center p-6">
        <div class="hud-panel w-full max-w-sm p-8 bg-black border-2 border-amber text-center modal-content shadow-[0_0_50px_rgba(255,170,0,0.2)]">
            <div class="text-amber text-xs tracking-[0.5em] mb-2">SYSTEM UPGRADE</div>
            <h2 class="text-4xl font-display text-white mb-4 glitch-text">LEVEL UP</h2>
            <div class="text-6xl font-bold text-amber mb-4" id="lvlUpNum">2</div>
            <div class="text-sm text-gray-400 font-mono mb-6">权限提升 // 算力增强</div>
            <button onclick="closeModal('levelUpModal')" class="w-full py-3 bg-amber text-black font-bold uppercase tracking-widest hover:bg-white transition">ACKNOWLEDGE</button>
        </div>
    </div>

    <!-- PRE-FLIGHT CHECK MODAL -->
    <div id="flowCheckModal" class="fixed inset-0 modal-overlay z-50 hidden flex items-center justify-center p-4">
        <div class="hud-panel w-full max-w-md p-6 border-cyan transform transition-all bg-dark modal-content">
            <h2 class="text-xl text-cyan mb-2 text-center" data-i18n="modal_dive_title">启动深潜模式</h2>
            <p class="text-center text-gray-400 text-[10px] font-mono mb-6" data-i18n="modal_dive_subtitle">引擎启动前检查清单</p>
            
            <div class="space-y-3 mb-6">
                <label class="flex items-center gap-3 p-3 border border-gray-800 active:border-cyan transition bg-void/50 cursor-pointer group">
                    <input type="checkbox" class="cyber-check checklist-item">
                    <div class="flex-1">
                        <div class="text-sm font-bold text-white group-active:text-cyan" data-i18n="check_target">目标锁定</div>
                        <div class="text-[10px] text-gray-500" data-i18n="check_target_desc">单一明确的目标。</div>
                    </div>
                </label>
                <label class="flex items-center gap-3 p-3 border border-gray-800 active:border-cyan transition bg-void/50 cursor-pointer group">
                    <input type="checkbox" class="cyber-check checklist-item">
                    <div class="flex-1">
                        <div class="text-sm font-bold text-white group-active:text-cyan" data-i18n="check_silence">通讯静默</div>
                        <div class="text-[10px] text-gray-500" data-i18n="check_silence_desc">手机勿扰，关闭通知。</div>
                    </div>
                </label>
                <label class="flex items-center gap-3 p-3 border border-gray-800 active:border-cyan transition bg-void/50 cursor-pointer group">
                    <input type="checkbox" class="cyber-check checklist-item">
                    <div class="flex-1">
                        <div class="text-sm font-bold text-white group-active:text-cyan" data-i18n="check_bio">生理机能</div>
                        <div class="text-[10px] text-gray-500" data-i18n="check_bio_desc">水，咖啡，洗手间。</div>
                    </div>
                </label>
            </div>

            <div class="flex gap-3">
                <button onclick="closeModal('flowCheckModal')" class="flex-1 py-3 border border-gray-700 text-gray-500 text-xs font-mono uppercase hover:text-white" data-i18n="btn_abort">放弃</button>
                <button id="engageBtn" onclick="confirmStart()" class="flex-1 py-3 bg-cyan/10 border border-cyan text-cyan font-bold font-display uppercase tracking-widest opacity-50 cursor-not-allowed" disabled data-i18n="btn_engage">接入系统</button>
            </div>
        </div>
    </div>

    <!-- HISTORY MODAL -->
    <div id="historyModal" class="fixed inset-0 modal-overlay z-50 hidden flex items-center justify-center p-4">
        <div class="hud-panel w-full max-w-lg h-[80vh] flex flex-col p-0 bg-dark modal-content">
            <div class="p-4 border-b border-gray-800 flex justify-between items-center bg-gray-900/50">
                <h2 class="text-lg text-amber" data-i18n="history_title">数据档案馆</h2>
                <button onclick="closeModal('historyModal')" class="text-gray-500 hover:text-white text-xl">×</button>
            </div>
            <div id="historyList" class="flex-1 overflow-y-auto p-4 space-y-4 text-sm font-mono"></div>
        </div>
    </div>

    <!-- GM TOOLS -->
    <div class="fixed bottom-4 right-4 text-[10px] text-gray-800 cursor-pointer z-[50]" onclick="toggleGM()">GM</div>
    <div class="gm-panel" id="gmPanel">
        <div class="flex justify-between items-center text-amber mb-3 border-b border-gray-700 pb-2">
            <span class="font-bold">DEBUG_MODE</span>
            <button onclick="toggleGM()" class="text-gray-500">×</button>
        </div>
        <div class="grid grid-cols-2 gap-2 font-mono text-xs">
            <button onclick="gmResetTasks()" class="border border-gray-600 p-2 text-gray-300">重置任务</button>
            <button onclick="gmFastForward()" class="border border-gray-600 p-2 text-gray-300">快进时间</button>
            <button onclick="gmAddXp()" class="border border-gray-600 p-2 text-gray-300">加 XP</button>
            <button onclick="gmClearStorage()" class="border border-red-900 text-red-500 p-2">清空缓存</button>
        </div>
    </div>

    <script>
        // --- LOCALIZATION ---
        const DICTIONARY = {
            zh: {
                system_online: "系统在线", history_btn: "档案馆", module_timer: "计时核心",
                status_idle: "待机中", status_focus: "专注链接", status_break: "系统冷却",
                mode_deep: "深潜", mode_skirmish: "突袭", mode_reboot: "重启", mode_cool: "冷却",
                chips_label: "神经芯片", objectives_subtitle: "协议: 单日上限 3 项任务",
                quick_ops_subtitle: "协议: < 2分钟的任务，立刻执行。",
                archive_day_btn: ">> 归档今日数据 <<",
                modal_dive_title: "启动深潜模式", modal_dive_subtitle: "引擎启动前检查清单",
                check_target: "目标锁定", check_target_desc: "单一明确的目标。",
                check_silence: "通讯静默", check_silence_desc: "手机勿扰，关闭通知。",
                check_bio: "生理机能", check_bio_desc: "水，咖啡，洗手间。",
                btn_abort: "放弃", btn_engage: "接入系统", history_title: "数据档案馆",
                tab_main: "主线任务", tab_side: "突发行动",
                task_ph: "> 输入任务指令...", side_ph: "> 2分钟内能搞定的事...",
                dialog_reset_title: "中断警告", dialog_reset_msg: "计时器正在运行。切换模式或重置将丢失当前进度。确认执行？",
                dialog_archive_title: "归档确认", dialog_archive_msg: "确认归档今日所有任务数据并重置列表？",
                dialog_debrief_title: "任务简报", dialog_debrief_msg: "检测到提前终止。确认已完成的任务以获取部分经验值：",
                rank_1: "义体乞丐", rank_2: "街头混混", rank_3: "赛博浪人", rank_4: "网络行者", rank_5: "传奇佣兵", rank_6: "荒坂塔顶"
            },
            en: {
                system_online: "SYSTEM ONLINE", history_btn: "ARCHIVES", module_timer: "TIMER CORE",
                status_idle: "IDLE", status_focus: "LINKED", status_break: "COOLDOWN",
                mode_deep: "DEEP", mode_skirmish: "SKIRMISH", mode_reboot: "REBOOT", mode_cool: "COOL",
                chips_label: "NEURAL CHIPS", objectives_subtitle: "PROTOCOL: 3 TASKS MAX / DAY",
                quick_ops_subtitle: "PROTOCOL: DO IT IF < 2 MINS.",
                archive_day_btn: ">> ARCHIVE DAY LOG <<",
                modal_dive_title: "INITIATE DIVE", modal_dive_subtitle: "PRE-FLIGHT CHECKLIST",
                check_target: "TARGET LOCKED", check_target_desc: "One clear goal defined.",
                check_silence: "COMMS SILENCED", check_silence_desc: "DND active, notifications off.",
                check_bio: "BIO-METRICS", check_bio_desc: "Hydrated, caffeinated.",
                btn_abort: "ABORT", btn_engage: "ENGAGE", history_title: "DATA ARCHIVES",
                tab_main: "PRIMARY", tab_side: "QUICK OPS",
                task_ph: "> INPUT DIRECTIVE...", side_ph: "> QUICK TASK (< 2m)...",
                dialog_reset_title: "INTERRUPT ALERT", dialog_reset_msg: "Timer is running. Switching/Resetting will lose progress. Confirm?",
                dialog_archive_title: "ARCHIVE CONFIRM", dialog_archive_msg: "Archive today's log and reset tasks?",
                dialog_debrief_title: "MISSION DEBRIEF", dialog_debrief_msg: "Early termination detected. Verify completed objectives for partial XP:",
                rank_1: "STREET RAT", rank_2: "GUTTER PUNK", rank_3: "EDGE RUNNER", rank_4: "NET RUNNER", rank_5: "LEGEND", rank_6: "ARASAKA TOP"
            }
        };

        // --- AUDIO SYSTEM (ROBUST FIX) ---
        const AudioSys = {
            ctx: null,
            init: function() {
                if (!this.ctx) {
                    this.ctx = new (window.AudioContext || window.webkitAudioContext)();
                }
            },
            safeInit: function() {
                // Call this on ANY user interaction
                if (!this.ctx) this.init();
                if (this.ctx && this.ctx.state === 'suspended') {
                    this.ctx.resume();
                }
            },
            playTone: function(freq, type, duration, vol = 0.1, startTime = 0) {
                if (!this.ctx) return;
                const osc = this.ctx.createOscillator();
                const gain = this.ctx.createGain();
                osc.type = type; 
                const t = startTime || this.ctx.currentTime;
                osc.frequency.setValueAtTime(freq, t);
                gain.gain.setValueAtTime(vol, t);
                gain.gain.exponentialRampToValueAtTime(0.01, t + duration);
                osc.connect(gain);
                gain.connect(this.ctx.destination);
                osc.start(t);
                osc.stop(t + duration);
            },
            sfx: {
                click: () => { AudioSys.safeInit(); AudioSys.playTone(800, 'square', 0.1, 0.05); },
                quick: () => { AudioSys.safeInit(); AudioSys.playTone(1500, 'sine', 0.1, 0.05); },
                start: () => {
                    AudioSys.safeInit();
                    const t = AudioSys.ctx.currentTime;
                    AudioSys.playTone(200, 'sawtooth', 0.5, 0.1, t);
                    AudioSys.playTone(400, 'sawtooth', 0.5, 0.1, t+0.1);
                    AudioSys.playTone(800, 'sawtooth', 0.8, 0.1, t+0.2);
                },
                alarm: () => {
                    AudioSys.safeInit();
                    const now = AudioSys.ctx.currentTime;
                    AudioSys.playTone(880, 'square', 0.1, 0.2, now);
                    AudioSys.playTone(880, 'square', 0.1, 0.2, now + 0.15);
                    AudioSys.playTone(880, 'square', 0.4, 0.2, now + 0.3);
                    if (navigator.vibrate) navigator.vibrate([200, 100, 200]);
                },
                xp: () => {
                    AudioSys.safeInit();
                    AudioSys.playTone(1200, 'sine', 0.1, 0.05);
                    setTimeout(() => AudioSys.playTone(1800, 'sine', 0.2, 0.05), 50);
                },
                levelUp: () => {
                    AudioSys.safeInit();
                    const now = AudioSys.ctx.currentTime;
                    AudioSys.playTone(100, 'square', 1.5, 0.2, now);
                    AudioSys.playTone(200, 'square', 1.5, 0.1, now);
                }
            }
        };

        // --- CORE STATE ---
        let currentLang = localStorage.getItem('cyber_lang') || 'zh';
        
        const STATE = {
            user: JSON.parse(localStorage.getItem('cyber_user')) || { xp: 0, level: 1 },
            tasks: JSON.parse(localStorage.getItem('cyber_tasks')) || [
                { id: 1, text: '', done: false }, { id: 2, text: '', done: false }, { id: 3, text: '', done: false }
            ],
            sideTasks: JSON.parse(localStorage.getItem('cyber_side_tasks')) || [], // New
            activeTab: 'primary',
            history: JSON.parse(localStorage.getItem('cyber_history')) || [],
            timer: {
                totalSeconds: 5400,
                remaining: 5400,
                active: false,
                mode: 'sprint',
                interval: null,
                startTime: 0 // Track when started for partial credit
            }
        };

        const UI = {
            timerDisplay: document.getElementById('timerDisplay'),
            ring: document.getElementById('progressRing'),
            modeLabel: document.getElementById('modeLabel'),
            taskList: document.getElementById('taskList'),
            modal: document.getElementById('flowCheckModal'),
            engageBtn: document.getElementById('engageBtn')
        };

        const CONFIG = {
            sprint: { time: 90 * 60, color: '#00f3ff', labelKey: 'mode_deep' },
            pomodoro: { time: 25 * 60, color: '#00f3ff', labelKey: 'mode_skirmish' },
            break: { time: 15 * 60, color: '#0aff00', labelKey: 'mode_reboot' },
            short: { time: 5 * 60, color: '#0aff00', labelKey: 'mode_cool' }
        };

        // --- COMMON FUNCTIONS ---
        function t(key) { return DICTIONARY[currentLang][key] || key; }

        function saveSystem() {
            localStorage.setItem('cyber_tasks', JSON.stringify(STATE.tasks));
            localStorage.setItem('cyber_side_tasks', JSON.stringify(STATE.sideTasks));
            localStorage.setItem('cyber_user', JSON.stringify(STATE.user));
            localStorage.setItem('cyber_history', JSON.stringify(STATE.history));
            localStorage.setItem('cyber_lang', currentLang);
        }

        // --- UNIFIED MODAL SYSTEM ---
        function showDialog(title, body, onConfirm, showCancel = true, extraContent = null) {
            AudioSys.sfx.click();
            document.getElementById('dialogTitle').innerText = title;
            document.getElementById('dialogBody').innerText = body;
            
            const confirmBtn = document.getElementById('dialogConfirm');
            const cancelBtn = document.getElementById('dialogCancel');
            const extraDiv = document.getElementById('dialogExtra');

            cancelBtn.style.display = showCancel ? 'block' : 'none';
            
            // Clone button to remove old listeners
            const newConfirm = confirmBtn.cloneNode(true);
            confirmBtn.parentNode.replaceChild(newConfirm, confirmBtn);
            
            newConfirm.onclick = () => {
                closeDialog();
                if(onConfirm) onConfirm();
            };

            // Inject extra content (checkboxes etc)
            if(extraContent) {
                extraDiv.innerHTML = '';
                extraDiv.appendChild(extraContent);
                extraDiv.classList.remove('hidden');
            } else {
                extraDiv.classList.add('hidden');
            }

            document.getElementById('dialogModal').classList.remove('hidden');
        }

        function closeDialog() {
            document.getElementById('dialogModal').classList.add('hidden');
        }

        function closeModal(id) {
            AudioSys.sfx.click();
            document.getElementById(id).classList.add('hidden');
        }

        // --- TIMER ENGINE ---
        function updateTimerDisplay() {
            const m = Math.floor(STATE.timer.remaining / 60);
            const s = STATE.timer.remaining % 60;
            UI.timerDisplay.textContent = `${String(m).padStart(2,'0')}:${String(s).padStart(2,'0')}`;
            
            const circumference = 628;
            const offset = circumference - (STATE.timer.remaining / STATE.timer.totalSeconds) * circumference;
            UI.ring.style.strokeDashoffset = offset;
            
            const currentConfig = CONFIG[STATE.timer.mode];
            UI.ring.style.stroke = currentConfig.color;
        }

        function updateTimerLabel() {
            const currentConfig = CONFIG[STATE.timer.mode];
            UI.modeLabel.textContent = STATE.timer.active ? t('status_focus') : t(currentConfig.labelKey);
            UI.modeLabel.style.color = currentConfig.color;
        }

        function toggleTimer() {
            AudioSys.safeInit();
            AudioSys.sfx.click();
            
            if (STATE.timer.active) {
                // Pause logic
                clearInterval(STATE.timer.interval);
                STATE.timer.active = false;
                document.getElementById('mainActionBtn').innerHTML = '▶';
                updateTimerLabel();
            } else {
                // Start logic
                if (STATE.timer.remaining <= 0) return;
                STATE.timer.startTime = Date.now(); // Log start time
                startTicker();
            }
        }

        function startTicker() {
            STATE.timer.active = true;
            document.getElementById('mainActionBtn').innerHTML = '❚❚';
            updateTimerLabel();
            AudioSys.sfx.start();
            
            STATE.timer.interval = setInterval(() => {
                if (STATE.timer.remaining > 0) {
                    STATE.timer.remaining--;
                    updateTimerDisplay();
                } else {
                    completeTimer();
                }
            }, 1000);
        }

        function checkTimerSafety(min, mode) {
            AudioSys.safeInit();
            // If timer is running, warn user
            if(STATE.timer.active || (STATE.timer.remaining !== STATE.timer.totalSeconds && STATE.timer.remaining !== 0)) {
                showDialog(t('dialog_reset_title'), t('dialog_reset_msg'), () => {
                    preFlightOrDirect(min, mode);
                });
            } else {
                preFlightOrDirect(min, mode);
            }
        }

        function preFlightOrDirect(min, mode) {
            // If it's a "Focus" mode (Deep/Skirmish), show checklist
            if(mode === 'sprint' || mode === 'pomodoro') {
                preFlightCheck(min, mode);
            } else {
                setTimerDirect(min, mode);
            }
        }

        function preFlightCheck(min, mode) {
            UI.modal.classList.remove('hidden');
            UI.modal.dataset.targetMin = min;
            UI.modal.dataset.targetMode = mode;
            document.querySelectorAll('.checklist-item').forEach(cb => cb.checked = false);
            checkGatekeeper();
        }

        function setTimerDirect(min, mode) {
            clearInterval(STATE.timer.interval);
            STATE.timer.active = false;
            STATE.timer.mode = mode;
            STATE.timer.totalSeconds = min * 60;
            STATE.timer.remaining = min * 60;
            document.getElementById('mainActionBtn').innerHTML = '▶';
            updateTimerDisplay();
            updateTimerLabel();
        }

        function confirmStart() {
            const min = UI.modal.dataset.targetMin;
            const mode = UI.modal.dataset.targetMode;
            closeModal('flowCheckModal');
            setTimerDirect(min, mode);
            startTicker();
        }

        function checkGatekeeper() {
            const allChecked = Array.from(document.querySelectorAll('.checklist-item')).every(cb => cb.checked);
            const btn = UI.engageBtn;
            if (allChecked) {
                btn.disabled = false;
                btn.classList.remove('opacity-50', 'cursor-not-allowed');
            } else {
                btn.disabled = true;
                btn.classList.add('opacity-50', 'cursor-not-allowed');
            }
        }

        // --- STOP & DEBRIEF (Early Finish) ---
        function triggerStop() {
            AudioSys.safeInit();
            if(!STATE.timer.active && STATE.timer.remaining === STATE.timer.totalSeconds) return;

            // Pause
            clearInterval(STATE.timer.interval);
            STATE.timer.active = false;
            document.getElementById('mainActionBtn').innerHTML = '▶';

            // Calculate Partial XP (1 XP per 2 mins completed)
            const elapsedSeconds = STATE.timer.totalSeconds - STATE.timer.remaining;
            const xpEarned = Math.floor((elapsedSeconds / 60) * 0.5); 

            // Create checkbox list for Debrief
            const listDiv = document.createElement('div');
            listDiv.className = "flex flex-col gap-2 bg-black/50 p-3 border border-gray-700 max-h-40 overflow-y-auto";
            
            STATE.tasks.forEach((t, i) => {
                if(t.text && !t.done) {
                    const label = document.createElement('label');
                    label.className = "flex items-center gap-2 text-xs text-white cursor-pointer hover:text-cyan";
                    label.innerHTML = `<input type="checkbox" class="cyber-check debrief-check" value="${i}"> ${t.text}`;
                    listDiv.appendChild(label);
                }
            });

            if(listDiv.children.length === 0) listDiv.innerHTML = '<div class="text-gray-500 italic text-xs">No active tasks found.</div>';

            showDialog(t('dialog_debrief_title'), `${t('dialog_debrief_msg')} (+${xpEarned} XP)`, () => {
                // Apply ticked tasks
                const checks = document.querySelectorAll('.debrief-check');
                checks.forEach(cb => {
                    if(cb.checked) {
                        STATE.tasks[cb.value].done = true;
                        GAME.addXp(50); // XP for task
                    }
                });
                GAME.addXp(xpEarned); // XP for time
                saveSystem();
                renderTasks();
                setTimerDirect(CONFIG[STATE.timer.mode].time / 60, STATE.timer.mode); // Reset to full
            }, true, listDiv);
        }

        function completeTimer() {
            clearInterval(STATE.timer.interval);
            STATE.timer.active = false;
            document.getElementById('mainActionBtn').innerHTML = '▶';
            
            AudioSys.sfx.alarm();
            
            const minutes = STATE.timer.totalSeconds / 60;
            const xpEarned = Math.floor(minutes * 2);
            GAME.addXp(xpEarned);

            confetti({ particleCount: 150, spread: 70, origin: { y: 0.6 }, colors: ['#00f3ff', '#ff0055'] });
            
            // Ask for task checkoff
            setTimeout(() => triggerStop(), 1000); 
        }

        // --- TASK SYSTEM ---
        function switchTab(tab) {
            AudioSys.safeInit();
            AudioSys.sfx.click();
            STATE.activeTab = tab;
            
            // UI Toggle
            document.querySelectorAll('.tab-btn').forEach(b => b.classList.remove('active'));
            document.getElementById(`tab-${tab}`).classList.add('active');
            
            // Desc Toggle
            document.getElementById('taskDesc').innerText = tab === 'primary' ? t('objectives_subtitle') : t('quick_ops_subtitle');
            
            renderTasks();
        }

        function renderTasks() {
            UI.taskList.innerHTML = '';
            
            if (STATE.activeTab === 'primary') {
                renderPrimaryTasks();
            } else {
                renderSideTasks();
            }
        }

        function renderPrimaryTasks() {
            let completed = 0;
            
            STATE.tasks.forEach((task, index) => {
                if(task.done) completed++;
                
                const div = document.createElement('div');
                div.className = `flex items-center gap-3 p-3 border transition-all duration-300 ${task.done ? 'border-neon-green bg-neon-green/10' : 'border-gray-800 bg-void/40 active:border-cyan'}`;
                
                div.innerHTML = `
                    <div class="font-mono text-xs opacity-50 w-4">0${index+1}</div>
                    <input type="text" 
                        id="taskInput_${index}"
                        value="${task.text}" 
                        class="flex-1 bg-transparent border-none outline-none text-white font-mono placeholder-gray-700 text-sm ${task.done ? 'line-through text-neon-green' : ''}"
                        placeholder="${t('task_ph')}"
                        onchange="updateTaskText(${index}, this.value)"
                        ${task.done ? 'disabled' : ''}
                    >
                    <button onclick="toggleTask(${index}, this)" class="w-8 h-8 border flex items-center justify-center transition ${task.done ? 'border-neon-green text-neon-green' : 'border-gray-700 text-gray-700 active:border-cyan active:text-cyan'}">
                        ${task.done ? '✓' : '⚡'}
                    </button>
                `;
                UI.taskList.appendChild(div);
            });
            
            const progressEl = document.getElementById('taskProgress');
            progressEl.textContent = `${completed}/3`;
            progressEl.className = `flex-1 text-right text-3xl font-display ${completed === 3 ? 'text-neon-green glitch-text' : 'text-gray-700'}`;
        }

        function renderSideTasks() {
            const progressEl = document.getElementById('taskProgress');
            progressEl.innerHTML = '<span class="text-xs tracking-widest text-cyan">∞</span>';

            // Add Input for new Side Task
            const inputDiv = document.createElement('div');
            inputDiv.className = 'border border-gray-700 p-2 flex gap-2 mb-2 bg-black';
            inputDiv.innerHTML = `
                <input type="text" id="newSideTask" class="flex-1 bg-transparent border-none outline-none text-white text-xs font-mono" placeholder="${t('side_ph')}">
                <button onclick="addSideTask()" class="text-cyan font-bold text-lg px-2">+</button>
            `;
            UI.taskList.appendChild(inputDiv);

            // Render List
            STATE.sideTasks.forEach((txt, idx) => {
                const div = document.createElement('div');
                div.className = 'flex items-center justify-between p-2 border border-gray-800 bg-void/30';
                div.innerHTML = `
                    <span class="text-xs text-gray-300">${txt}</span>
                    <button onclick="completeSideTask(${idx}, this)" class="text-gray-600 hover:text-cyan text-xs font-bold">[ DONE ]</button>
                `;
                UI.taskList.appendChild(div);
            });
        }

        function addSideTask() {
            const input = document.getElementById('newSideTask');
            const val = input.value.trim();
            if(val) {
                STATE.sideTasks.unshift(val); // Add to top
                saveSystem();
                renderTasks();
                AudioSys.sfx.click();
            }
        }

        function completeSideTask(idx, btnEl) {
            AudioSys.sfx.quick();
            // Animation then remove
            btnEl.parentElement.style.opacity = '0';
            btnEl.parentElement.style.transform = 'translateX(20px)';
            
            GAME.addXp(15, btnEl); // Small XP reward

            setTimeout(() => {
                STATE.sideTasks.splice(idx, 1);
                saveSystem();
                renderTasks();
            }, 300);
        }

        function updateTaskText(index, val) {
            STATE.tasks[index].text = val;
            if(!val.trim()) STATE.tasks[index].done = false;
            saveSystem();
            if(!val.trim()) renderTasks();
        }

        function toggleTask(index, btnEl) {
            AudioSys.safeInit();
            AudioSys.sfx.click();
            if(!STATE.tasks[index].done && !STATE.tasks[index].text.trim()) return;

            STATE.tasks[index].done = !STATE.tasks[index].done;
            if(STATE.tasks[index].done) {
                AudioSys.sfx.xp();
                GAME.addXp(50, btnEl);
            }
            saveSystem();
            renderTasks();
            updateUserStats();
        }

        function archiveDay() {
            AudioSys.safeInit();
            const hasContent = STATE.tasks.some(t => t.text.trim().length > 0) || STATE.sideTasks.length > 0;
            if(!hasContent) return;

            showDialog(t('dialog_archive_title'), t('dialog_archive_msg'), () => {
                const now = new Date();
                const record = {
                    date: now.toISOString(),
                    tasks: JSON.parse(JSON.stringify(STATE.tasks)),
                    sideTasks: [...STATE.sideTasks],
                    completedCount: STATE.tasks.filter(t => t.done).length
                };

                STATE.history.unshift(record);
                STATE.tasks.forEach(t => { t.text = ''; t.done = false; });
                STATE.sideTasks = []; // Clear side tasks daily
                saveSystem();
                renderTasks();
                AudioSys.sfx.xp();
            });
        }

        // --- RPG SYSTEM ---
        const GAME = {
            titles: ['rank_1', 'rank_2', 'rank_3', 'rank_4', 'rank_5', 'rank_6'],
            calculateLevel: (xp) => Math.floor(Math.sqrt(xp / 100)) + 1,
            nextLevelXp: (lvl) => 100 * Math.pow(lvl, 2),
            addXp: (amount, eventType) => {
                STATE.user.xp += amount;
                const newLevel = GAME.calculateLevel(STATE.user.xp);
                showFloatingText(`+${amount} XP`, eventType);
                
                if(newLevel > STATE.user.level) {
                    STATE.user.level = newLevel;
                    // Custom Level Up Modal
                    setTimeout(() => {
                        AudioSys.sfx.levelUp();
                        document.getElementById('lvlUpNum').innerText = newLevel;
                        document.getElementById('levelUpModal').classList.remove('hidden');
                    }, 500);
                }
                saveSystem();
                updateUserStats();
            }
        };

        function updateUserStats() {
            const lvl = GAME.calculateLevel(STATE.user.xp);
            const nextXp = GAME.nextLevelXp(lvl);
            const prevXp = GAME.nextLevelXp(lvl - 1);
            const levelRange = nextXp - prevXp;
            const currentProgress = STATE.user.xp - prevXp;
            const percent = Math.min(100, Math.max(0, (currentProgress / levelRange) * 100));

            document.getElementById('userLevel').innerText = lvl;
            document.getElementById('currentXp').innerText = STATE.user.xp;
            document.getElementById('nextLevelXp').innerText = nextXp;
            document.getElementById('xpBar').style.width = `${percent}%`;
            
            const titleIndex = Math.min(lvl - 1, GAME.titles.length - 1);
            document.getElementById('userTitle').innerText = t(GAME.titles[titleIndex]);
        }

        function showFloatingText(text, sourceElement) {
            const float = document.createElement('div');
            float.className = 'xp-float';
            float.innerText = text;
            let x, y;
            if(sourceElement && sourceElement.getBoundingClientRect) {
                const rect = sourceElement.getBoundingClientRect();
                x = rect.left + rect.width / 2;
                y = rect.top;
            } else {
                x = window.innerWidth / 2;
                y = window.innerHeight / 2;
            }
            float.style.left = `${x}px`;
            float.style.top = `${y}px`;
            document.body.appendChild(float);
            setTimeout(() => float.remove(), 1500);
        }

        // --- UTILS ---
        function openHistory() {
            AudioSys.safeInit();
            const list = document.getElementById('historyList');
            list.innerHTML = '';
            
            if(STATE.history.length === 0) {
                list.innerHTML = `<div class="text-center text-gray-600 mt-10">NO DATA FOUND</div>`;
            } else {
                STATE.history.forEach(rec => {
                    const dateObj = new Date(rec.date);
                    const dateStr = dateObj.toLocaleDateString() + ' ' + dateObj.toLocaleTimeString([], {hour: '2-digit', minute:'2-digit'});
                    
                    const div = document.createElement('div');
                    div.className = 'border border-gray-800 p-3 bg-white/5 mb-2';
                    
                    let taskHtml = '';
                    rec.tasks.forEach(t => {
                        if(t.text) {
                            taskHtml += `<div class="flex gap-2 items-center text-xs text-gray-400">
                                <span class="${t.done ? 'text-neon-green' : 'text-red-500'}">${t.done ? '✓' : '×'}</span>
                                <span class="${t.done ? 'line-through' : ''}">${t.text}</span>
                            </div>`;
                        }
                    });

                    div.innerHTML = `
                        <div class="flex justify-between items-center mb-2 border-b border-gray-700 pb-1">
                            <span class="text-neon-cyan">${dateStr}</span>
                            <span class="text-xs ${rec.completedCount >= 3 ? 'text-neon-green' : 'text-gray-500'}">SCORE: ${rec.completedCount}</span>
                        </div>
                        <div class="space-y-1">${taskHtml}</div>
                    `;
                    list.appendChild(div);
                });
            }
            document.getElementById('historyModal').classList.remove('hidden');
        }

        function toggleLang() {
            currentLang = currentLang === 'zh' ? 'en' : 'zh';
            AudioSys.sfx.click();
            saveSystem();
            renderText();
        }

        function renderText() {
            document.querySelectorAll('[data-i18n]').forEach(el => {
                el.innerText = t(el.dataset.i18n);
            });
            document.querySelectorAll('input[placeholder]').forEach(el => {
               if(el.id.includes('taskInput')) el.placeholder = t('task_ph');
               if(el.id === 'newSideTask') el.placeholder = t('side_ph');
            });
            document.getElementById('langBtn').innerText = currentLang === 'zh' ? 'EN' : '中';
            updateUserStats();
            updateTimerLabel();
            // Update tab text specifically
            document.getElementById('tab-primary').innerText = t('tab_main');
            document.getElementById('tab-side').innerText = t('tab_side');
        }
        
        function toggleChip(el) {
            AudioSys.sfx.click();
            if(el.style.opacity === '0.3' || el.style.opacity === '') {
                el.style.opacity = '1';
                el.style.transform = 'scale(1.1)';
                el.style.boxShadow = '0 0 10px #ffaa00';
            } else {
                el.style.opacity = '0.3';
                el.style.transform = 'scale(1)';
                el.style.boxShadow = 'none';
            }
        }

        // --- GM ---
        function toggleGM() { document.getElementById('gmPanel').classList.toggle('open'); }
        function gmResetTasks() { STATE.tasks.forEach(t => { t.done = false; t.text = ''; }); saveSystem(); renderTasks(); }
        function gmFastForward() { if(STATE.timer.remaining > 60) { STATE.timer.remaining -= 60; updateTimerDisplay(); } }
        function gmAddXp() { GAME.addXp(50); }
        function gmClearStorage() { if(confirm('WIPE?')) { localStorage.clear(); location.reload(); } }

        // Boot
        (function init(){
            // Sanitize
            STATE.tasks = STATE.tasks.map(t => ({...t, done: t.text ? t.done : false }));
            renderTasks();
            updateTimerDisplay();
            updateUserStats();
            renderText();
            document.querySelectorAll('.checklist-item').forEach(cb => cb.addEventListener('change', () => { AudioSys.sfx.click(); checkGatekeeper(); }));
            // Bind keyboard enter for side tasks
            document.addEventListener('keypress', function (e) {
                if (e.key === 'Enter' && document.activeElement.id === 'newSideTask') {
                    addSideTask();
                }
            });
        })();
    </script>
</body>
</html>
